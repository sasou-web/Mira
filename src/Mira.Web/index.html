<!doctype html>
<html lang="fr">
<head>

  <meta name="description" content="Ta bibliothèque Jellyfin dans Mira, sur ton téléphone.">
  <meta name="mira-version" content="{{version}}">
  <meta name="theme-color" content="#070708">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="v/{{rev}}/app.css">

      <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">

</html>
