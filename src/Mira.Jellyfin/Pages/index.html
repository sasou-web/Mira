<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mira</title>
  <meta name="description" content="Mira is an app for Windows, Mac and iPhone.">
  <meta name="mira-version" content="{{version}}">
  <meta name="theme-color" content="#070708">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-title" content="Mira">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="v/{{rev}}/img/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="v/{{rev}}/img/apple-touch-icon.png">
  <link rel="stylesheet" href="v/{{rev}}/pages.css">
  <script type="module" src="v/{{rev}}/pages.js"></script>
</head>
<body>
  <!-- What /Mira says since Mira web is gone: the phones that kept it on their Home Screen open this. -->
  <main class="page">
    <svg class="mark" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
      <path fill="#f5f5f7" d="M12 1C3 1 1 3 1 12S3 23 12 23 23 21 23 12 21 1 12 1Z"/>
      <path fill="none" stroke="#101013" stroke-width="2.65" stroke-linecap="round" stroke-linejoin="round" d="M6.3 16.5V10.6C6.3 6.3 12 6.3 12 10.6V15.6M12 10.6C12 6.3 17.7 6.3 17.7 10.6V16.5"/>
    </svg>
    <div class="page-body">
      <h1 data-fr="Mira dans le navigateur, c’est fini">Mira in the browser has ended</h1>
      <p class="lead" data-fr="Mira est maintenant une app pour Windows, Mac et iPhone. Ton Jellyfin, tes titres et ta progression restent les mêmes.">Mira is now an app for Windows, Mac and iPhone. Your Jellyfin, your titles and your progress stay the same.</p>
      <div class="ways">
        <a class="btn primary block" href="https://miracinema.app" rel="noreferrer" data-fr="Installer Mira">Get Mira</a>
      </div>
      <p class="note" data-fr="Tu peux retirer cette icône de l’écran d’accueil.">You can remove this icon from your Home Screen.</p>
    </div>
  </main>
</body>
</html>
