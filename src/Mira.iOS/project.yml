# Mira for iPhone and iPad: the Xcode project, generated on the runner by XcodeGen (`xcodegen generate` in this folder),
# never kept in the repository. .github/workflows/ios.yml builds it, runs its tests on the simulator and packages the
# unsigned .ipa that AltStore signs on the iPhone with its owner's own Apple account. Built-in Tailscale
# (Frameworks/MiraTailscale.xcframework) is built first by tools/ios/tailscale.sh.
name: Mira
options:
  bundleIdPrefix: app.miracinema
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    # Swift 6 language mode: complete concurrency checking. The version of Mira for Windows, set by ios.yml.
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0.0.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Nothing is signed here: AltStore signs the .ipa on the iPhone, the simulator runs it as is.
    DEVELOPMENT_TEAM: ""
targets:
  Mira:
    type: application
    platform: iOS
    sources:
      - path: Mira
        excludes:
          - Info.plist
    dependencies:
      # Built-in Tailscale: Go's static library (src/Mira.Tailscale/ios), linked into the app.
      - framework: Frameworks/MiraTailscale.xcframework
        embed: false
    info:
      path: Mira/Info.plist
      properties:
        CFBundleDisplayName: Mira
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Mira's « m » on Mira's black, at the size and place where Mira's opening starts writing it (App/Opening.swift,
        # tools/ios/launch-mark.mjs): centred on the whole screen, as the opening draws it.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        # Picture in Picture and AirPlay go on with the app in the background; « Keep on this iPhone » goes on as
        # long as iOS lets it (BGContinuedProcessingTask, Kept/Keeper.swift: one identifier under this prefix per run).
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - app.miracinema.Mira.keep.*
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Nunito-Regular.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
        # Jellyfin at home and over Tailscale answers in plain HTTP (http://192.168.1.20:8096, http://100.x.y.z:8096):
        # Tailscale already encrypts, and Mira warns before a password goes in clear over the Internet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Mira connects to your Jellyfin server on your home network.
        # « Open in Mira » of a party link's page (mira://party/<code>?server=…), as on Windows and Mac.
        CFBundleURLTypes:
          - CFBundleURLName: app.miracinema.Mira
            CFBundleURLSchemes: [mira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.miracinema.Mira
        PRODUCT_NAME: Mira
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # What Go's runtime calls in the system: its name resolver, the certificates' checks.
        OTHER_LDFLAGS: ["-lresolv", "-framework", "Security", "-framework", "CoreFoundation"]
  MiraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiraTests
      # Cases shared with Mira web and Mira for Windows and Mac.
      - path: ../../tests/fixtures/bitrate.json
        buildPhase: resources
      - path: ../../tests/fixtures/filters.json
        buildPhase: resources
      - path: ../../tests/fixtures/sleep.json
        buildPhase: resources
      - path: ../../tests/fixtures/still-watching.json
        buildPhase: resources
      - path: ../../tests/fixtures/spoilers.json
        buildPhase: resources
      - path: ../../tests/fixtures/syncplay.json
        buildPhase: resources
      - path: ../../tests/fixtures/choices.json
        buildPhase: resources
      - path: ../../tests/fixtures/resume.json
        buildPhase: resources
      - path: ../../tests/fixtures/chapters.json
        buildPhase: resources
      - path: ../../tests/fixtures/home.json
        buildPhase: resources
      - path: ../../tests/fixtures/report.json
        buildPhase: resources
      - path: ../../tests/fixtures/seasons.json
        buildPhase: resources
      - path: ../../tests/fixtures/new-episodes.json
        buildPhase: resources
      - path: ../../tests/fixtures/overview.json
        buildPhase: resources
      - path: ../../tests/fixtures/viewers.json
        buildPhase: resources
      - path: ../../tests/fixtures/releases.json
        buildPhase: resources
      - path: ../../tests/fixtures/torlink-remote.json
        buildPhase: resources
      - path: ../../tests/fixtures/torlink-lines.json
        buildPhase: resources
      - path: ../../tests/fixtures/diagnostics.json
      - path: ../../tests/fixtures/connect.json
        buildPhase: resources
      - path: ../../tests/fixtures/trailers.json
        buildPhase: resources
      - path: ../../tests/fixtures/remote.json
        buildPhase: resources
      - path: ../../tests/fixtures/calendar.json
        buildPhase: resources
      - path: ../../tests/fixtures/collections.json
        buildPhase: resources
      - path: ../../tests/fixtures/languages.json
        buildPhase: resources
      - path: ../../tests/fixtures/parts.json
        buildPhase: resources
    dependencies:
      - target: Mira
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.miracinema.MiraTests
  MiraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiraUITests
    dependencies:
      - target: Mira
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.miracinema.MiraUITests
        TEST_TARGET_NAME: Mira
schemes:
  Mira:
    build:
      targets:
        Mira: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MiraTests
        - MiraUITests
    archive:
      config: Release
