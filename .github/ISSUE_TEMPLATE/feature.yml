name: Suggest an improvement
description: A need, or something Mira could do better
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: English or French, as you like.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Windows
        - Mac
        - iPhone or iPad
        - All of them
        - The Jellyfin extension
    validations:
      required: false
  - type: textarea
    id: need
    attributes:
      label: What's the problem?
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: A concrete example or a sketch helps.
    validations:
      required: true
