name: Subtitle sources
# « Sous-titres automatiques » against the real services, on demand only (never on a push: it spends one download of
# each source's daily quota, and a service down must not make the CI red): one search and one download from
# OpenSubtitles with Mira's own key, and from SubDL when the SUBDL_API_KEY secret is set.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/Mira.Core.Tests/Mira.Core.Tests.csproj --configfile NuGet.Config
      - name: Build
        run: dotnet build tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-restore
      - name: Real sources
        env:
          MIRA_SUBTITLES_LIVE: "1"
          MIRA_SUBDL_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: dotnet run --project tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-build -- --filter "vraies sources"
