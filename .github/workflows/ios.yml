name: iPhone build
# Mira for iPhone and iPad (src/Mira.iOS): Built-in Tailscale built from src/Mira.Tailscale (tools/ios/tailscale.sh),
# the Xcode project generated by XcodeGen, its French checked complete, its tests run on the simulator against a
# stand-in Jellyfin (tools/ios/mock-jellyfin.mjs), reached once through a stand-in Tailscale network (mira-testnet),
# with a capture of each screen, then the unsigned .ipa that AltStore signs on the iPhone with its owner's own Apple
# account (AltStore Classic), attached with its SHA-256 to the draft of each release, which tools/release.ps1 publishes
# once every platform is there. The site's AltStore source (tools/site/altstore.mjs) points at the .ipa of the latest
# release.
on:
  push:
    branches: [main]
    paths: ["src/Mira.iOS/**", "src/Mira.Tailscale/**", "tools/ios/**", "tests/fixtures/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["src/Mira.iOS/**", "src/Mira.Tailscale/**", "tools/ios/**", "tests/fixtures/**", ".github/workflows/ios.yml"]
  # No "release: published": GitHub runs nothing for a draft, and an immutable release takes no file once published.
  workflow_dispatch:
    inputs:
      release:
        description: "Draft release to attach the .ipa to (vX.Y.Z); set by tools/release.ps1"
        required: false
        type: string
      commit:
        description: "Commit that draft targets (40 hexadecimal characters); set by tools/release.ps1"
        required: false
        type: string
      device:
        description: "Simulator to test on, to see the app on another size of iPhone (iPhone 17 Pro by default)"
        required: false
        type: string
permissions:
  contents: read
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
jobs:
  build:
    # Apple Silicon, Xcode 26 (iOS 26 SDK, Swift 6.2 or later).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # A release's draft and commit, checked before anything uses them; they reach scripts through env only.
      - name: Release inputs
        if: inputs.release != '' || inputs.commit != ''
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: vX.Y.Z expected, got '$RELEASE'" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit: 40 hexadecimal characters expected, got '$COMMIT'" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The draft's commit for a release; otherwise the event's own.
          ref: ${{ inputs.commit }}
          persist-credentials: false
      # The Go of src/Mira.Tailscale, for Built-in Tailscale and the stand-in Tailscale network of the tests.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/Mira.Tailscale/go.mod
          cache-dependency-path: src/Mira.Tailscale/go.sum
      - name: Xcode and XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      # Mira's version, as for Windows and Mac: the release's, or the one written in Mira for Windows' project.
      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then version="${RELEASE#v}"
          else version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Desktop/Mira.Desktop.csproj); fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version: x.y.z expected, got '$version'" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "Mira $version"
      # Go's static library for the iPhone and its simulator, which the Xcode project links.
      - name: Built-in Tailscale
        run: tools/ios/tailscale.sh
      - name: Generate the Xcode project
        working-directory: src/Mira.iOS
        run: xcodegen generate
      # Every text of the app has its French: the strings Xcode finds in the code, exported for French, each translated.
      - name: French texts
        run: |
          mkdir -p .artifacts
          xcodebuild -exportLocalizations -project src/Mira.iOS/Mira.xcodeproj -localizationPath .artifacts/localizations -exportLanguage fr \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO > .artifacts/localizations.log 2>&1 \
            || { grep -E -A3 "error:" .artifacts/localizations.log | head -150; tail -20 .artifacts/localizations.log; exit 1; }
          node tools/ios/strings.mjs .artifacts/localizations
      - name: Simulator
        id: simulator
        env:
          DEVICE: ${{ inputs.device || 'iPhone 17 Pro' }}
        run: |
          # The newest iPhone 17 Pro the runner has (or the one asked), its status bar as on Apple's pictures.
          xcrun simctl list devices available | grep -E "^ +iPhone" | sed -E 's/ \(.*//' | sort -u
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime: continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-"))
              found += [(version, d["udid"]) for d in devices if d["name"] == os.environ["DEVICE"]]
          print(max(found)[1])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      # The film of the player's captures, Sintel's trailer (© Blender Foundation, CC BY 3.0), and its trickplay
      # pictures made here as Jellyfin makes them; without it, Sintel plays the 10 s clip as every other title does.
      # The pictures by ffmpeg, imageio-ffmpeg's static build from PyPI pinned by its hash, as web.yml takes it:
      # AVFoundation cannot decode a video on this runner.
      - name: Film for the player's captures
        run: |
          if curl -fsSL --retry 3 --max-time 180 -o tools/ios/media/film.mp4 https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4; then
            shasum -a 256 tools/ios/media/film.mp4
            echo 'imageio-ffmpeg==0.6.0 --hash=sha256:b1ae3173414b5fc5f538a726c4e48ea97edc0d2cdc11f103afee655c463fa742' > "$RUNNER_TEMP/ffmpeg.txt"
            # In a throwaway venv: the runner's Python may refuse packages outside one (PEP 668).
            if python3 -m venv "$RUNNER_TEMP/venv" \
              && "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --quiet --no-deps --only-binary ':all:' --require-hashes \
                --target "$RUNNER_TEMP/ffmpeg" -r "$RUNNER_TEMP/ffmpeg.txt"; then
              ffmpeg=$(ls "$RUNNER_TEMP"/ffmpeg/imageio_ffmpeg/binaries/ffmpeg-macos-*); chmod +x "$ffmpeg"
              FFMPEG="$ffmpeg" sh tools/ios/trickplay.sh tools/ios/media/film.mp4 tools/ios/media/trickplay \
                || { rm -rf tools/ios/media/trickplay; echo "::warning::No trickplay pictures for the player's captures."; }
            fi
          else
            rm -f tools/ios/media/film.mp4
            echo "::warning::No film for the player's captures: Sintel plays the test clip."
          fi
      - name: Tests on the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node tools/ios/mock-jellyfin.mjs > .artifacts/mock-jellyfin.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18097/System/Info/Public > /dev/null && break; sleep 0.5; done
          # A Tailscale network of its own on this Mac (coordination server, relay, a « Jellyfin PC » that shows the
          # stand-in Jellyfin on it): what the app's Built-in Tailscale joins in testTailscale, never Tailscale's.
          (cd src/Mira.Tailscale && go build -trimpath -tags "$(cat build-tags.txt)" -o ../../.artifacts/mira-testnet ./cmd/mira-testnet)
          .artifacts/mira-testnet -addr 127.0.0.1:18090 -forward 8096=127.0.0.1:18097 -info .artifacts/testnet.json -v > .artifacts/mira-testnet.log 2>&1 &
          for i in $(seq 1 120); do [ -s .artifacts/testnet.json ] && break; sleep 0.5; done
          [ -s .artifacts/testnet.json ] || { tail -40 .artifacts/mira-testnet.log; echo "The stand-in Tailscale network did not start" >&2; exit 1; }
          cat .artifacts/testnet.json
          status=0
          TEST_RUNNER_MIRA_TS_CONTROL=http://127.0.0.1:18090 \
          xcodebuild test -project src/Mira.iOS/Mira.xcodeproj -scheme Mira -destination "id=$UDID" -resultBundlePath .artifacts/tests.xcresult \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" > .artifacts/tests.log 2>&1 || status=$?
          grep -E "error:|Test Case .* (passed|failed|skipped)|✔|✘|Executed|\*\* TEST" .artifacts/tests.log | tail -120 || true
          [ $status -eq 0 ] || tail -60 .artifacts/tests.log
          xcrun xcresulttool get test-results summary --path .artifacts/tests.xcresult --compact 2>/dev/null | head -c 4000 || true
          exit $status
      # The log Built-in Tailscale kept in the app's folder (testTailscale runs last: no reset after it), and the stand-in
      # network's: on a failure, the end of each here, all of them in the artifact.
      - name: Tailscale logs
        if: always()
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          STATUS: ${{ job.status }}
        run: |
          data=$(xcrun simctl get_app_container "$UDID" app.miracinema.Mira data 2>/dev/null) || exit 0
          cp "$data/Library/Application Support/Tailscale/mira-tailscale.log" .artifacts/mira-tailscale.log 2>/dev/null || exit 0
          if [ "$STATUS" != success ]; then
            echo "::group::mira-tailscale.log (the app's node)"; tail -150 .artifacts/mira-tailscale.log; echo "::endgroup::"
            echo "::group::mira-testnet.log (the stand-in network)"; tail -150 .artifacts/mira-testnet.log; echo "::endgroup::"
          fi
      # The captures the UI tests attached, named as they named them.
      - name: Captures
        if: always()
        run: |
          [ -d .artifacts/tests.xcresult ] || exit 0
          mkdir -p .artifacts/screens .artifacts/attachments
          xcrun xcresulttool export attachments --path .artifacts/tests.xcresult --output-path .artifacts/attachments || exit 0
          python3 - <<'EOF'
          import json, os, re, shutil
          root = ".artifacts/attachments"
          # Only the tests' own captures ("02-home"), not what XCTest adds on a failure (hierarchy, recording).
          for test in json.load(open(os.path.join(root, "manifest.json"))):
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "").split("_")[0]
                  if re.fullmatch(r"[0-9]{2}[a-z]?-[a-z-]+", name) and attachment["exportedFileName"].endswith(".png"):
                      shutil.copy(os.path.join(root, attachment["exportedFileName"]), os.path.join(".artifacts/screens", name + ".png"))
          EOF
          ls -la .artifacts/screens
      # Small JPEG copies of the captures, in base64, to review them without downloading the artifact.
      # Lines read: MIRA-PREVIEW <name> <part>/<parts> <base64>.
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/screens/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            sips -s format jpeg -s formatOptions 45 -Z 900 "$file" --out "$small" >/dev/null
            data=$(base64 -i "$small" | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW $name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mira-ios-check
          path: |
            .artifacts/screens
            .artifacts/tests.log
            .artifacts/localizations.log
            .artifacts/mock-jellyfin.log
            .artifacts/mira-testnet.log
            .artifacts/mira-tailscale.log
          retention-days: 7
      # The app for iPhones, unsigned: AltStore signs it on the iPhone with the Apple account of whoever installs it.
      - name: Unsigned .ipa
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive -project src/Mira.iOS/Mira.xcodeproj -scheme Mira -configuration Release -destination "generic/platform=iOS" \
            -archivePath .artifacts/Mira.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" > .artifacts/archive.log 2>&1 || { tail -80 .artifacts/archive.log; exit 1; }
          app=.artifacts/Mira.xcarchive/Products/Applications/Mira.app
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          # What AltStore checks against the source: the bundle id and the versions, exactly.
          [ "$(plist CFBundleIdentifier)" = app.miracinema.Mira ] && [ "$(plist CFBundleShortVersionString)" = "$VERSION" ] && [ "$(plist CFBundleVersion)" = "$VERSION" ] \
            || { echo "Info.plist: $(plist CFBundleIdentifier) $(plist CFBundleShortVersionString) ($(plist CFBundleVersion))" >&2; exit 1; }
          [ "$(plist MinimumOSVersion)" = 26.0 ] || { echo "MinimumOSVersion: $(plist MinimumOSVersion)" >&2; exit 1; }
          lipo -info "$app/Mira"
          mkdir -p .artifacts/ipa/Payload dist/ios
          cp -R "$app" .artifacts/ipa/Payload/
          ipa="Mira-$VERSION-ios.ipa"
          (cd .artifacts/ipa && zip -qry "../../dist/ios/$ipa" Payload)
          (cd dist/ios && shasum -a 256 "$ipa" > "$ipa.sha256" && cat "$ipa.sha256")
          ls -la dist/ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mira-ios
          path: |
            dist/ios/*.ipa
            dist/ios/*.ipa.sha256
          retention-days: 14
  release:
    # The draft tools/release.ps1 made gets its .ipa here, built from the draft's commit and tested above.
    if: inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mira-ios
          path: ios
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "release or commit invalid" >&2; exit 1; }
          ipa="Mira-${RELEASE#v}-ios.ipa"
          (cd ios && sha256sum --strict -c -- "$ipa.sha256")
          # Only the draft made for this very commit: never a published release, nor a draft made since for another.
          state=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[(.isDraft | tostring), .targetCommitish] | join(" ")')
          [ "$state" = "true $COMMIT" ] || { echo "$RELEASE is not a draft for $COMMIT (found: $state)" >&2; exit 1; }
          # Never --clobber: a fresh draft holds none of these files, and one already there must stop the upload.
          gh release upload "$RELEASE" "ios/$ipa" "ios/$ipa.sha256" --repo "$GITHUB_REPOSITORY"
