name: README captures
# The captures of the README (docs/screenshots/readme/): Mira for Windows, the real window, and Mira for iPhone on the
# simulator, each signed in to a real Jellyfin 12.1 whose library is the README's demonstration one (tools/banner/media.sh: animated films and series, black placeholder
# videos) with its TMDb artwork. Run on request (Run workflow) from a branch other than main: the captures are committed to that branch, to
# go to main through its pull request; from main, they are only kept as an artifact. Never on a push or a pull
# request: its own commit would start it again.
on:
  workflow_dispatch:
    inputs:
      language:
        description: Language of the captures (en or fr)
        default: en
        type: choice
        options: [en, fr]
  # A release's banner (banner.yml) takes Mira for Windows' and Mira for iPhone's captures from here: one job, nothing committed.
  workflow_call:
    inputs:
      language:
        type: string
        default: en
      windows_only:
        type: boolean
        default: false
      iphone_only:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}-${{ inputs.windows_only && 'banner' || inputs.iphone_only && 'banner-iphone' || 'readme' }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GALLERY_USER: Camille
  GALLERY_PASSWORD: mira-gallery
  GALLERY_LANGUAGE: ${{ inputs.language || 'en' }}
jobs:
  windows:
    if: ${{ !inputs.iphone_only }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Jellyfin 12.1 from its sources
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: The library
        shell: bash
        run: tools/banner/media.sh "$PWD/.artifacts/media"
      # For a release's banner only: a stand-in for TheTVDB's plugin, whose missing episodes of Invincible the banner's
      # windows-missing shows (tools/web/fake-tvdb), in Jellyfin's plugins before it starts.
      - name: Missing episodes (banner)
        if: inputs.windows_only
        shell: pwsh
        run: |
          $plugin = Join-Path $PWD '.artifacts/jf-data/data/plugins/FakeTvdb_9999.0.0.0'
          New-Item -ItemType Directory -Force -Path $plugin | Out-Null
          dotnet build tools/web/fake-tvdb/FakeTvdb.csproj -c Release -o .artifacts/fake-tvdb -nologo -v q
          if ($LASTEXITCODE -ne 0) { throw 'tools/web/fake-tvdb did not build.' }
          Copy-Item .artifacts/fake-tvdb/Jellyfin.Plugin.FakeTvdb.dll $plugin
      - name: Jellyfin, its library and a viewer's traces
        shell: pwsh
        run: |
          $j = Join-Path $PWD '.artifacts/jf-data'
          foreach ($d in 'data', 'cache', 'config', 'log') { New-Item -ItemType Directory -Force -Path (Join-Path $j $d) | Out-Null }
          $ffmpeg = (Get-Command ffmpeg).Source
          Start-Process -FilePath dotnet -ArgumentList @('.artifacts/jf/jellyfin.dll', '--datadir', "$j/data", '--cachedir', "$j/cache", '--configdir', "$j/config", '--logdir', "$j/log", '--nowebclient', '--ffmpeg', $ffmpeg) -WindowStyle Hidden
          node tools/gallery/setup.mjs http://127.0.0.1:8096 (Join-Path $PWD '.artifacts/media') $env:GALLERY_USER $env:GALLERY_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw 'Jellyfin setup failed.' }
      # For a release's banner only: the mini-player plays a film (windows-mini), so libmpv as Mira installs it, in the
      # profile, and that film's video made of its backdrop (the library's videos are black).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.windows_only
        with:
          path: .artifacts/player-work/libmpv.7z
          key: libmpv-${{ hashFiles('src/Mira.Core/MpvPackage.cs') }}
      - name: libmpv and a film made of its backdrop (banner)
        if: inputs.windows_only
        shell: bash
        run: |
          pwsh -NoProfile -File tools/mpv-engine.ps1 -Work .artifacts/player-work -ProfileFolder .artifacts/gallery-profile
          node tools/banner/stills.mjs http://127.0.0.1:8096 "$GALLERY_USER" "$GALLERY_PASSWORD" .artifacts/stills
          name="Spider-Man Across the Spider-Verse (2023)"
          ffmpeg -loglevel error -y -loop 1 -framerate 1 -i .artifacts/stills/still-spider-verse.jpg -f lavfi -i anullsrc=r=48000:cl=stereo -t 600 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,format=yuv420p" \
            -c:v libx264 -preset ultrafast -tune stillimage -crf 20 -g 600 -c:a aac -b:a 32k .artifacts/still-master.mkv
          ffmpeg -loglevel error -y -stream_loop -1 -i .artifacts/still-master.mkv -t $((140 * 60)) -c copy -metadata:s:a:0 language=eng .artifacts/still-film.mkv
          mv -f .artifacts/still-film.mkv ".artifacts/media/Films/$name/$name.mkv"
      # The runner's screen is 1024 × 768, smaller than the window captured: Windows would shrink it to fit.
      - name: Screen of 1920 × 1080
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build Mira for Windows
        run: |
          dotnet restore src/Mira.Desktop/Mira.Desktop.csproj --configfile NuGet.Config
          dotnet build src/Mira.Desktop/Mira.Desktop.csproj -c Release --no-restore
      - name: Capture the window
        shell: pwsh
        env:
          MIRA_GALLERY_SERVER: http://127.0.0.1:8096
          # A release's banner: its own screens too (filters, missing episodes, the mini-player).
          MIRA_GALLERY_BANNER: ${{ inputs.windows_only && '1' || '0' }}
        run: |
          $exe = 'src/Mira.Desktop/bin/Release/net10.0-windows10.0.19041.0/Mira.exe'
          $output = Join-Path $PWD '.artifacts/gallery'
          $profile = Join-Path $PWD '.artifacts/gallery-profile'
          $env:MIRA_GALLERY_USER = $env:GALLERY_USER; $env:MIRA_GALLERY_PASSWORD = $env:GALLERY_PASSWORD
          # In the language asked for (en by default, fr for docs/README.fr.md): the runner's Windows is in English, which Mira would otherwise follow.
          $run = Start-Process -FilePath $exe -ArgumentList @('--data', "`"$profile`"", '--language', $env:GALLERY_LANGUAGE, '--readme-gallery', "`"$output`"") -PassThru
          if (-not $run.WaitForExit(420000)) { $run.Kill(); throw 'The captures did not finish within 7 minutes.' }
          $result = Get-Content -LiteralPath (Join-Path $output 'gallery-result.txt') -Raw
          Write-Output $result
          if ($run.ExitCode -ne 0 -or $result -notlike 'PASS:*') { throw 'The captures failed.' }
      - name: Jellyfin log
        if: failure()
        shell: pwsh
        run: Get-ChildItem .artifacts/jf-data/log -Filter *.log | ForEach-Object { Get-Content $_.FullName -Tail 60 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gallery-windows
          path: .artifacts/gallery/*.png
          retention-days: 7

  iphone:
    # Mira for iPhone on the simulator (an iPhone 17 Pro, 1206 × 2622), signed in to Jellyfin 12.1 built from its
    # sources on this Mac with the same library: Home, the films, a film's page, a group on it, a series' episodes
    # (testGallery of MiraUITests, skipped by ios.yml).
    if: ${{ !inputs.windows_only }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The Go of src/Mira.Tailscale: the app links Built-in Tailscale.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/Mira.Tailscale/go.mod
          cache-dependency-path: src/Mira.Tailscale/go.sum
      - name: XcodeGen and ffmpeg
        run: |
          # Tried three times: Homebrew's downloads sometimes stall.
          for attempt in 1 2 3; do brew install xcodegen ffmpeg && break; [ "$attempt" = 3 ] && exit 1; sleep 30; done
          ffmpeg -hide_banner -version | head -1
      - name: Jellyfin 12.1 from its sources
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: The library
        run: |
          tools/banner/media.sh "$PWD/.artifacts/media"
          # Every film, series and episode, for setup.mjs to wait for the whole scan.
          echo "MIRA_GALLERY_TITLES=$(( $(find .artifacts/media -name '*.mkv' | wc -l) + $(ls .artifacts/media/Séries | wc -l) ))" >> "$GITHUB_ENV"
      - name: Jellyfin, its library and a viewer's traces
        run: |
          j="$PWD/.artifacts/jf-data"
          mkdir -p "$j/data" "$j/cache" "$j/config" "$j/log"
          nohup dotnet .artifacts/jf/jellyfin.dll --datadir "$j/data" --cachedir "$j/cache" --configdir "$j/config" --logdir "$j/log" \
            --nowebclient --ffmpeg "$(command -v ffmpeg)" > .artifacts/jellyfin.log 2>&1 &
          node tools/gallery/setup.mjs http://127.0.0.1:8096 "$PWD/.artifacts/media" "$GALLERY_USER" "$GALLERY_PASSWORD"
      - name: Built-in Tailscale
        run: tools/ios/tailscale.sh
      - name: Generate the Xcode project
        working-directory: src/Mira.iOS
        run: xcodegen generate
      - name: Simulator
        id: simulator
        run: |
          # The newest iPhone 17 Pro the runner has, its status bar as on Apple's pictures (as ios.yml).
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime: continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-"))
              found += [(version, d["udid"]) for d in devices if d["name"] == "iPhone 17 Pro"]
          print(max(found)[1])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: Capture Mira for iPhone
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          status=0
          TEST_RUNNER_MIRA_GALLERY_SERVER=127.0.0.1:8096 TEST_RUNNER_MIRA_GALLERY_USER="$GALLERY_USER" \
          TEST_RUNNER_MIRA_GALLERY_PASSWORD="$GALLERY_PASSWORD" TEST_RUNNER_MIRA_GALLERY_LANGUAGE="$GALLERY_LANGUAGE" \
          xcodebuild test -project src/Mira.iOS/Mira.xcodeproj -scheme Mira -destination "id=$UDID" -resultBundlePath .artifacts/gallery.xcresult \
            -only-testing:MiraUITests/MiraUITests/testGallery > .artifacts/gallery.log 2>&1 || status=$?
          grep -E "error:|Test Case .* (passed|failed|skipped)|\*\* TEST" .artifacts/gallery.log | tail -40 || true
          [ $status -eq 0 ] || tail -60 .artifacts/gallery.log
          mkdir -p .artifacts/attachments .artifacts/gallery
          xcrun xcresulttool export attachments --path .artifacts/gallery.xcresult --output-path .artifacts/attachments
          python3 - <<'EOF'
          import json, os, re, shutil
          root = ".artifacts/attachments"
          for test in json.load(open(os.path.join(root, "manifest.json"))):
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "").split("_")[0]
                  if re.fullmatch(r"iphone-[a-z-]+", name) and attachment["exportedFileName"].endswith(".png"):
                      shutil.copy(os.path.join(root, attachment["exportedFileName"]), os.path.join(".artifacts/gallery", name + ".png"))
          EOF
          ls -la .artifacts/gallery
          # Small JPEG copies in the log, to see them without the artifact: MIRA-PREVIEW <name> <part>/<parts> <base64>.
          for file in .artifacts/gallery/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            sips -s format jpeg -s formatOptions 45 -Z 900 "$file" --out "$small" >/dev/null
            data=$(base64 -i "$small" | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW $name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
          exit $status
      - name: Jellyfin log
        if: failure()
        run: |
          tail -60 .artifacts/jellyfin.log
          tail -80 .artifacts/jf-data/log/*.log 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gallery-iphone
          path: .artifacts/gallery/*.png
          retention-days: 7

  commit:
    # Only on another branch than main: main takes them through a pull request.
    if: github.ref_name != 'main' && !inputs.windows_only && !inputs.iphone_only
    needs: [windows, iphone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gallery-*
          merge-multiple: true
          path: .artifacts/gallery
      - name: JPEG copies in docs/screenshots/readme
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p docs/screenshots/readme
          for file in .artifacts/gallery/*.png; do
            ffmpeg -loglevel error -y -i "$file" -q:v 3 "docs/screenshots/readme/$(basename "$file" .png).jpg"
          done
          ls -la docs/screenshots/readme
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add docs/screenshots/readme
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh the README's captures"
          git push origin "HEAD:$BRANCH"
