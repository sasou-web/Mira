name: Presentation video library
# TEMPORARY (never merged): the presentation video's pictures. Mira for Windows and the iPhone app on a real Jellyfin
# 12.1 holding the README's library with its TMDb artwork (presentation/media.sh, library.mjs): each page of the window
# drawn whole at twice its size (--demo-shots), the iPhone's screen after each slow drag (MiraTour.testShots), committed
# to this branch for a montage at 60 frames a second (the runners film at 3 to 15).
on:
  push:
    branches: [claude/project-thread-dqmaw4]
    paths: [presentation/*.sh, presentation/*.mjs, .github/workflows/presentation.yml, src/Mira.Desktop/Checks/MainWindow.DemoShots.cs, src/Mira.iOS/MiraUITests/MiraTour.swift]
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"
jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[iphone only]') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Jellyfin 12.1 from its sources
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: The library, Spring and Sprite Fright for real
        shell: bash
        run: |
          # A Windows path for ffmpeg: MSYS leaves a path with an apostrophe (Howl's) unconverted.
          presentation/media.sh "$(cygpath -m "$PWD/.artifacts/media")"
          for f in "Spring (2019)/spring" "Sprite Fright (2021)/sprite-fright"; do
            dir=".artifacts/media/Films/${f%/*}"; rm -f "$dir"/*.mkv
            curl -fsSL --retry 3 -o "$dir/${f%/*}.mp4" "https://github.com/lakson-llc/kyte-demo-media/releases/download/v1/${f#*/}.mp4"
          done
          echo "TITLES=$(( $(find .artifacts/media -name '*.mkv' -o -name '*.mp4' | wc -l) + $(ls .artifacts/media/Séries | wc -l) ))" >> "$GITHUB_ENV"
      - name: Jellyfin, its library and a viewer's traces
        shell: pwsh
        run: |
          $j = Join-Path $PWD '.artifacts/jf-data'
          foreach ($d in 'data', 'cache', 'config', 'log') { New-Item -ItemType Directory -Force -Path (Join-Path $j $d) | Out-Null }
          $ffmpeg = (Get-Command ffmpeg).Source
          Start-Process -FilePath dotnet -ArgumentList @('.artifacts/jf/jellyfin.dll', '--datadir', "$j/data", '--cachedir', "$j/cache", '--configdir', "$j/config", '--logdir', "$j/log", '--nowebclient', '--ffmpeg', $ffmpeg) -WindowStyle Hidden
          node presentation/library.mjs http://127.0.0.1:8096 (Join-Path $PWD '.artifacts/media/Films') (Join-Path $PWD '.artifacts/media/Séries')
          if ($LASTEXITCODE -ne 0) { throw 'Jellyfin setup failed.' }
      - name: Screen of 1920 × 1080
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build Mira for Windows
        run: |
          dotnet restore src/Mira.Desktop/Mira.Desktop.csproj --configfile NuGet.Config
          dotnet build src/Mira.Desktop/Mira.Desktop.csproj -c Release --no-restore
      - name: The pictures
        shell: pwsh
        env:
          MIRA_GALLERY_SERVER: http://127.0.0.1:8096
          MIRA_GALLERY_USER: Sam
          MIRA_GALLERY_PASSWORD: mira-demo
        run: |
          $exe = 'src/Mira.Desktop/bin/Release/net10.0-windows10.0.19041.0/Mira.exe'
          $out = Join-Path $PWD '.artifacts/out'; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $profile = Join-Path $PWD '.artifacts/shots-profile'
          & ./tools/mpv-engine.ps1 -Work .artifacts/mpv -ProfileFolder $profile
          $run = Start-Process -FilePath $exe -ArgumentList @('--data', "`"$profile`"", '--demo-shots', "`"$out`"") -PassThru
          if (-not $run.WaitForExit(1500000)) { $run.Kill() }
          Get-Content (Join-Path $out 'demo-shots-result.txt') -Raw
          Get-ChildItem $out | Format-Table Name, Length
          if (-not (Select-String -Path (Join-Path $out 'demo-shots-result.txt') -Pattern '^PASS' -Quiet)) { exit 1 }
      - name: Jellyfin log
        if: failure()
        shell: pwsh
        run: Get-ChildItem .artifacts/jf-data/log -Filter *.log | ForEach-Object { Get-Content $_.FullName -Tail 60 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shots-windows
          path: .artifacts/out/*
          retention-days: 3

  iphone:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/Mira.Tailscale/go.mod
          cache-dependency-path: src/Mira.Tailscale/go.sum
      - name: Tools
        run: brew install xcodegen ffmpeg
      - name: Jellyfin 12.1 and the library
        run: |
          (cd .artifacts/jellyfin-src && dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q)
          presentation/media.sh "$PWD/.artifacts/media"
          export TITLES=$(( $(find .artifacts/media -name '*.mkv' | wc -l) + $(ls .artifacts/media/Séries | wc -l) ))
          j="$PWD/.artifacts/jf-data"; mkdir -p "$j"/{data,cache,config,log}
          nohup dotnet .artifacts/jf/jellyfin.dll --datadir "$j/data" --cachedir "$j/cache" --configdir "$j/config" --logdir "$j/log" --nowebclient --ffmpeg "$(command -v ffmpeg)" > .artifacts/jellyfin.log 2>&1 &
          node presentation/library.mjs http://127.0.0.1:8096 "$PWD/.artifacts/media/Films" "$PWD/.artifacts/media/Séries"
      - name: The app
        run: |
          tools/ios/tailscale.sh
          (cd src/Mira.iOS && xcodegen generate)
      - name: Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime: continue
              version = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[1].split("-"))
              found += [(version, d["udid"]) for d in devices if d["name"] == "iPhone 17 Pro"]
          print(max(found)[1])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid"
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: The pictures
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p .artifacts/out .artifacts/attachments
          xcodebuild build-for-testing -project src/Mira.iOS/Mira.xcodeproj -scheme Mira -destination "id=$UDID" -derivedDataPath .artifacts/dd > .artifacts/build.log 2>&1 || { tail -40 .artifacts/build.log; exit 1; }
          status=0
          TEST_RUNNER_MIRA_SHOTS=1 xcodebuild test-without-building -project src/Mira.iOS/Mira.xcodeproj -scheme Mira -destination "id=$UDID" -derivedDataPath .artifacts/dd \
            -resultBundlePath .artifacts/shots.xcresult -only-testing:MiraUITests/MiraTour/testShots > .artifacts/shots.log 2>&1 || status=$?
          grep -o "MIRA-TOUR .*" .artifacts/shots.log | sort -u -k3n > .artifacts/out/iphone-steps.txt || true
          grep -E "error:|Test Case|\*\* TEST" .artifacts/shots.log | tail -20
          xcrun xcresulttool export attachments --path .artifacts/shots.xcresult --output-path .artifacts/attachments
          python3 - <<'PY'
          import json, os, re, subprocess
          root = ".artifacts/attachments"
          for test in json.load(open(os.path.join(root, "manifest.json"))):
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "").split("_")[0]
                  if re.fullmatch(r"shot-[a-z0-9-]+", name) and attachment["exportedFileName"].endswith(".png"):
                      subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "95", os.path.join(root, attachment["exportedFileName"]), "--out", os.path.join(".artifacts/out", name[5:] + ".jpg")], check=True, capture_output=True)
          PY
          ls -la .artifacts/out
          exit $status
      - name: Jellyfin log
        if: failure()
        run: tail -80 .artifacts/jellyfin.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shots-iphone
          path: .artifacts/out/*
          retention-days: 3

  commit:
    needs: [windows, iphone]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: shots-*
          path: presentation/shots
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          find presentation/shots -type f -size +95M -print -delete
          ls -laR presentation/shots
          git add -f presentation/shots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Presentation: the pictures" || exit 0
          git push origin "HEAD:$BRANCH"
