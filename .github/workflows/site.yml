name: Site
# miracinema.app: the showcase site (site/), served by GitHub Pages, its download links set to the latest published
# release. Runs when the site changes on main and when a release is published (tools/release.ps1, through gh, so the
# event fires: a release published by GITHUB_TOKEN would not start this workflow). A release's run is on its tag, which
# the github-pages environment refuses (main only): it starts this workflow again on main, the one deploy it allows
# (a workflow_dispatch is the one event GITHUB_TOKEN may start).
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "tools/site/**", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: node tools/site/build.mjs "${{ steps.release.outputs.version }}" dist/site
      # The AltStore source of Mira for iPhone (altstore.json): the .ipa of each published release.
      - name: AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          node tools/site/altstore.mjs "$RUNNER_TEMP/releases.json" dist/site
      # Nothing a page loads may come from another host (each page's policy says so too): links only.
      - name: No third-party request
        run: |
          if grep -rnIE '(src|srcset)="(https?:)?//|url\((https?:)?//' dist/site; then exit 1; fi
          if grep -rnIE '<link [^>]*href="(https?:)?//' dist/site | grep -vE 'rel="(canonical|alternate)"'; then exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
