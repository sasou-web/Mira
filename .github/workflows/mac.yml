name: Mac build
# Mira for Mac (Apple Silicon): built, packaged with libmpv, checked on a real Mac, then attached with its SHA-256 to
# the draft of each release, which tools/release.ps1 publishes once every platform is there.
on:
  push:
    branches: [main]
    paths: ["src/Mira.Mac/**", "src/Mira.Core/**", "src/Mira.Tailscale/**", "tools/mac/**", "tools/tailscale/**", "tests/Mira.Core.Tests/*Tailnet*", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["src/Mira.Mac/**", "src/Mira.Core/**", "src/Mira.Tailscale/**", "tools/mac/**", "tools/tailscale/**", "tests/Mira.Core.Tests/*Tailnet*", ".github/workflows/mac.yml"]
  # No "release: published": GitHub runs nothing for a draft, and an immutable release takes no file once published.
  workflow_dispatch:
    inputs:
      release:
        description: "Draft release to attach the disk image to (vX.Y.Z); set by tools/release.ps1"
        required: false
        type: string
      commit:
        description: "Commit that draft targets (40 hexadecimal characters); set by tools/release.ps1"
        required: false
        type: string
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  icon-car:
    # Mira's icon for macOS 26 (tools/mac/icon-car.sh): Xcode 26's actool only works on macOS 26.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Assets.car
        run: |
          sw_vers; xcodebuild -version
          tools/mac/icon-car.sh "$RUNNER_TEMP/icon"
          assetutil --info "$RUNNER_TEMP/icon/Assets.car" | grep -E '"(AssetType|Name|Idiom)"' | sort | uniq -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mira-mac-icon
          path: ${{ runner.temp }}/icon/Assets.car
          if-no-files-found: error
          retention-days: 1
  build:
    needs: icon-car
    # Apple Silicon. The libraries come from Homebrew, built for this macOS: Mira needs it or later (tools/mac/package.sh
    # checks it against the minimum it declares).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # A release's draft and commit, checked before anything uses them; they reach scripts through env only.
      - name: Release inputs
        if: inputs.release != '' || inputs.commit != ''
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: vX.Y.Z expected, got '$RELEASE'" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit: 40 hexadecimal characters expected, got '$COMMIT'" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The draft's commit for a release; otherwise the event's own.
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: mpv and dylibbundler
        run: brew install mpv dylibbundler
      # Go for Built-in Tailscale's node (tools/tailscale/build.mjs, run by tools/mac/package.sh), at the version go.mod
      # names. Its modules and builds are kept between runs, never for a release: it fetches them afresh, checked against
      # Go's checksum database.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/Mira.Tailscale/go.mod
          cache: ${{ inputs.release == '' }}
          cache-dependency-path: src/Mira.Tailscale/go.sum
      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then version="${RELEASE#v}"
          else version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Mac/Mira.Mac.csproj); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "Mira $version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mira-mac-icon
          path: ${{ runner.temp }}/icon
      - name: Package Mira.app and the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MIRA_ASSETS_CAR: ${{ runner.temp }}/icon/Assets.car
        run: tools/mac/package.sh "$VERSION"
      # Mira's icon as this macOS (15) shows it, for its preview below; the job « icon-check » does the same on macOS 26.
      - name: Icon on macOS 15
        run: |
          mkdir -p .artifacts/icon
          swift tools/mac/icon-shown.swift dist/mac/Mira.app .artifacts/icon/icon-macos15.png
          assetutil --info dist/mac/Mira.app/Contents/Resources/Assets.car | grep -E '"(AssetType|Name|RenditionName)"' | sort | uniq -c
      # The disk image's window as Finder opens it, in dark then light appearance, for its previews below: the picture,
      # the icons' places and the labels Finder writes over the picture (their colour follows the appearance).
      - name: Disk image window
        run: |
          mkdir -p .artifacts/dmg
          dmg=$(ls dist/mac/*.dmg)
          volume=$(hdiutil attach "$dmg" | awk -F '\t' '/\/Volumes\// { print $NF }')
          echo "Mounted at $volume"
          for appearance in dark light; do
            if [ "$appearance" = dark ]; then dark=true; else dark=false; fi
            # A global default alone leaves Finder light: System Events changes it for the whole session.
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark" || echo "appearance left as it was"
            killall Finder 2>/dev/null || true; sleep 4
            open "$volume"; sleep 6
            screencapture -x ".artifacts/dmg/screen-$appearance.png"
            # The window and a margin around it (Finder may move it down from where tools/mac/dmg/settings.py puts it).
            screencapture -x -R 160,120,720,600 ".artifacts/dmg/dmg-$appearance.png"
          done
          killall Finder 2>/dev/null || true
          hdiutil detach "$volume" || hdiutil detach -force "$volume"
      # The automatic update on a real Mac: a copy of Mira.app, marked, replaced by the one of the disk image just built
      # (mounted read-only, copied beside it, bundle id, version and signature checked), by the script that swaps them
      # once Mira has quit. The copy must then be the image's, signature intact, nothing left beside it.
      - name: Automatic update (disk image to Mira.app)
        run: |
          work="$RUNNER_TEMP/update-check"; rm -rf "$work"; mkdir -p "$work/Applications" "$work/updates"
          app="$work/Applications/Mira.app"
          ditto dist/mac/Mira.app "$app"
          touch "$app/Contents/mira-old-copy"
          "$app/Contents/MacOS/Mira" --update-check "$(ls "$PWD"/dist/mac/*.dmg)" "$work/updates"
          for i in $(seq 1 60); do [ -f "$work/updates/mac-result" ] && break; sleep 1; done
          echo "Result: $(cat "$work/updates/mac-result" 2>/dev/null)"
          grep -q '^done ' "$work/updates/mac-result"
          test ! -e "$app/Contents/mira-old-copy"
          test ! -e "$work/Applications/.Mira.app.update" && test ! -e "$work/Applications/.Mira.app.old"
          codesign --verify --deep --strict "$app"
          if hdiutil info | grep -q "$work"; then echo "disk image left mounted"; exit 1; fi
          ls -la "$work/Applications"
      # The app itself, on this Mac: every screen against a stand-in Jellyfin, then playback in OpenGL and in software.
      - name: Self-check
        run: |
          mkdir -p .artifacts/media
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=duration=30:size=1280x720:rate=24 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest .artifacts/media/test.mkv
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=duration=6:size=1280x720:rate=24 -f lavfi -i sine=frequency=550:duration=6 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest .artifacts/media/short.mkv
          app=dist/mac/Mira.app/Contents/MacOS/Mira
          status=0
          "$app" --data "$PWD/.artifacts/profile" --self-check "$PWD/.artifacts/check" --mock --media "$PWD/.artifacts/media/test.mkv" --short "$PWD/.artifacts/media/short.mkv" > .artifacts/check.log 2>&1 &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then echo "self-check still running after 5 minutes"; kill $pid; status=1; else wait $pid || status=$?; fi
          cat .artifacts/check/results.txt 2>/dev/null || tail -40 .artifacts/check.log
          echo "— Avalonia et OpenGL :"; grep -a -i -E "opengl|gpu|metal|render|exception" .artifacts/check.log | head -30 || true
          # A crash (139 = segmentation fault) says nothing in results.txt: the end of the log at least.
          if [ "$status" -gt 128 ]; then echo "— fin du journal :"; tail -60 .artifacts/check.log; fi
          exit $status
      # Built-in Tailscale: the node of Mira.app as it ships (signed with it, this version) joins mira-testnet's Tailscale
      # network and reaches its Jellyfin, as on Linux in ci.yml (tests/Mira.Core.Tests): sign-in through the login page,
      # requests, WebSocket and mpv (Homebrew's libmpv) through the node, then the PC off and the node's key expired.
      - name: Built-in Tailscale (the node of Mira.app on a test network)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd src/Mira.Tailscale && CGO_ENABLED=0 go build -trimpath -tags "$(cat build-tags.txt)" -o "$RUNNER_TEMP/mira-testnet" ./cmd/mira-testnet)
          dotnet restore tests/Mira.Core.Tests/Mira.Core.Tests.csproj --configfile NuGet.Config
          MIRA_TAILNET_HELPER="$PWD/dist/mac/Mira.app/Contents/MacOS/mira-tailscale" MIRA_TAILNET_TESTNET="$RUNNER_TEMP/mira-testnet" \
          MIRA_TAILNET_MPV="$(brew --prefix)/lib/libmpv.dylib" MIRA_TAILNET_VERSION="$VERSION" \
            dotnet run --project tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-restore -- --filter "Tailscale intégré"
      # Built-in Tailscale in Mira itself (src/Mira.Mac/Checks/TailnetCheck.cs): Mira.app as it ships signs in to the test
      # network from its login page, then to the self-check's stand-in Jellyfin, which Mira serves on a port the network's
      # Jellyfin PC forwards; Home and a film through the node, the PC off then on. Started again on the same profile, the
      # node starts with Mira, then « Se déconnecter de Tailscale » erases it.
      - name: Built-in Tailscale in Mira (sign-in, playback, PC off, started again, signed out)
        run: |
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          "$RUNNER_TEMP/mira-testnet" -addr 127.0.0.1:0 -forward "8096=127.0.0.1:$port" -info "$RUNNER_TEMP/testnet.json" > .artifacts/testnet.log 2>&1 &
          testnet=$!
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/testnet.json" ] && break; sleep 1; done
          control=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["control"])' "$RUNNER_TEMP/testnet.json")
          app=dist/mac/Mira.app/Contents/MacOS/Mira
          status=0
          for run in 1 2; do
            "$app" --data "$PWD/.artifacts/tailnet-profile" --tailnet-check "$PWD/.artifacts/tailnet" --tailnet-control "$control" --mock-port "$port" \
              --media "$PWD/.artifacts/media/test.mkv" > ".artifacts/tailnet-$run.log" 2>&1 &
            pid=$!
            for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then echo "tailnet check (run $run) still running after 5 minutes"; kill $pid; status=1; else wait $pid || status=$?; fi
            [ $status -eq 0 ] || { tail -60 ".artifacts/tailnet-$run.log"; break; }
          done
          cat .artifacts/tailnet/result.txt .artifacts/tailnet/result-again.txt 2>/dev/null || true
          kill $testnet 2>/dev/null || true
          exit $status
      # The renderer alone, for a diagnosis: which OpenGL this Mac gives Mira, and whether mpv's picture reaches the screen.
      - name: Video probe
        if: always()
        run: |
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal|Resolution" || true
          app=dist/mac/Mira.app/Contents/MacOS/Mira
          ( "$app" --video-probe "$PWD/.artifacts/media/test.mkv" > .artifacts/probe.log 2>&1 & pid=$!; for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done; kill $pid 2>/dev/null ) || true
          grep -a -i -E "probe|opengl|gpu|metal|exception" .artifacts/probe.log | head -30 || true
      # Small JPEG copies of the captures, in base64, to review them without downloading the artifact.
      # Lines read: MIRA-PREVIEW <name> <part>/<parts> <base64>.
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/check/*.png .artifacts/dmg/dmg-*.png .artifacts/tailnet/*.png .artifacts/icon/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            sips -s format jpeg -s formatOptions 45 -Z 720 "$file" --out "$small" >/dev/null
            data=$(base64 -i "$small" | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW $name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Mira-mac-check
          path: |
            .artifacts/check
            .artifacts/check.log
            .artifacts/dmg
            .artifacts/icon
            .artifacts/tailnet
            .artifacts/tailnet-*.log
            .artifacts/testnet.log
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mira-mac-arm64
          path: |
            dist/mac/*.dmg
            dist/mac/*.dmg.sha256
          retention-days: 14
  icon-check:
    # Mira's icon as macOS 26 shows it, from the disk image built above: drawn by macOS from Mira.icon (Assets.car), never
    # on the grey tile macOS 26 gives an icon it does not recognise. Lines read: MIRA-PREVIEW <name> <part>/<parts> <base64>.
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mira-mac-arm64
          path: mac
      - name: Icon on macOS 26
        run: |
          sw_vers
          volume=$(hdiutil attach mac/*.dmg | awk -F '\t' '/\/Volumes\// { print $NF }')
          mkdir -p icon
          swift tools/mac/icon-shown.swift "$volume/Mira.app" icon/icon-macos26.png
          hdiutil detach "$volume" || hdiutil detach -force "$volume"
          sips -s format jpeg -s formatOptions 70 icon/icon-macos26.png --out icon/icon-macos26.jpg >/dev/null
          data=$(base64 -i icon/icon-macos26.jpg | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
          for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW icon-macos26 $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
  release:
    # The draft tools/release.ps1 made gets its Mac disk image here, built from the draft's commit and checked above.
    if: inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mira-mac-arm64
          path: mac
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "release or commit invalid" >&2; exit 1; }
          dmg="Mira-${RELEASE#v}-mac-arm64.dmg"
          # The disk image and its SHA-256, checked against each other once more before they go out together.
          (cd mac && sha256sum --strict -c -- "$dmg.sha256")
          # Only the draft made for this very commit: never a published release, nor a draft made since for another.
          state=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[(.isDraft | tostring), .targetCommitish] | join(" ")')
          [ "$state" = "true $COMMIT" ] || { echo "$RELEASE is not a draft for $COMMIT (found: $state)" >&2; exit 1; }
          # Never --clobber: a fresh draft holds none of these files, and one already there must stop the upload.
          gh release upload "$RELEASE" "mac/$dmg" "mac/$dmg.sha256" --repo "$GITHUB_REPOSITORY"
