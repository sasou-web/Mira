name: Mac build
# Mira for Mac (Apple Silicon): built, packaged with libmpv, checked on a real Mac, then attached with its SHA-256 to
# the draft of each release, which tools/release.ps1 publishes once every platform is there.
on:
  push:
    branches: [main]
    paths: ["src/Mira.Mac/**", "src/Mira.Core/**", "tools/mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["src/Mira.Mac/**", "src/Mira.Core/**", "tools/mac/**", ".github/workflows/mac.yml"]
  # No "release: published": GitHub runs nothing for a draft, and an immutable release takes no file once published.
  workflow_dispatch:
    inputs:
      release:
        description: "Draft release to attach the disk image to (vX.Y.Z); set by tools/release.ps1"
        required: false
        type: string
      commit:
        description: "Commit that draft targets (40 hexadecimal characters); set by tools/release.ps1"
        required: false
        type: string
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  build:
    # Apple Silicon. The libraries come from Homebrew, built for this macOS: Mira needs it or later (tools/mac/package.sh
    # checks it against the minimum it declares).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # A release's draft and commit, checked before anything uses them; they reach scripts through env only.
      - name: Release inputs
        if: inputs.release != '' || inputs.commit != ''
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: vX.Y.Z expected, got '$RELEASE'" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit: 40 hexadecimal characters expected, got '$COMMIT'" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The draft's commit for a release; otherwise the event's own.
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: mpv and dylibbundler
        run: brew install mpv dylibbundler
      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then version="${RELEASE#v}"
          else version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Mac/Mira.Mac.csproj); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "Mira $version"
      - name: Package Mira.app and the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/mac/package.sh "$VERSION"
      # The disk image's window as Finder opens it, in dark then light appearance, for its previews below: the picture,
      # the icons' places and the labels Finder writes over the picture (their colour follows the appearance).
      - name: Disk image window
        run: |
          mkdir -p .artifacts/dmg
          dmg=$(ls dist/mac/*.dmg)
          volume=$(hdiutil attach "$dmg" | awk -F '\t' '/\/Volumes\// { print $NF }')
          echo "Mounted at $volume"
          for appearance in dark light; do
            if [ "$appearance" = dark ]; then dark=true; else dark=false; fi
            # A global default alone leaves Finder light: System Events changes it for the whole session.
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark" || echo "appearance left as it was"
            killall Finder 2>/dev/null || true; sleep 4
            open "$volume"; sleep 6
            screencapture -x ".artifacts/dmg/screen-$appearance.png"
            # The window and a margin around it (Finder may move it down from where tools/mac/dmg/settings.py puts it).
            screencapture -x -R 160,120,720,600 ".artifacts/dmg/dmg-$appearance.png"
          done
          killall Finder 2>/dev/null || true
          hdiutil detach "$volume" || hdiutil detach -force "$volume"
      # The app itself, on this Mac: every screen against a stand-in Jellyfin, then playback in OpenGL and in software.
      - name: Self-check
        run: |
          mkdir -p .artifacts/media
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=duration=30:size=1280x720:rate=24 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest .artifacts/media/test.mkv
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=duration=6:size=1280x720:rate=24 -f lavfi -i sine=frequency=550:duration=6 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest .artifacts/media/short.mkv
          app=dist/mac/Mira.app/Contents/MacOS/Mira
          status=0
          "$app" --data "$PWD/.artifacts/profile" --self-check "$PWD/.artifacts/check" --mock --media "$PWD/.artifacts/media/test.mkv" --short "$PWD/.artifacts/media/short.mkv" > .artifacts/check.log 2>&1 &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then echo "self-check still running after 5 minutes"; kill $pid; status=1; else wait $pid || status=$?; fi
          cat .artifacts/check/results.txt 2>/dev/null || tail -40 .artifacts/check.log
          echo "— Avalonia et OpenGL :"; grep -a -i -E "opengl|gpu|metal|render|exception" .artifacts/check.log | head -30 || true
          exit $status
      # The renderer alone, for a diagnosis: which OpenGL this Mac gives Mira, and whether mpv's picture reaches the screen.
      - name: Video probe
        if: always()
        run: |
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal|Resolution" || true
          app=dist/mac/Mira.app/Contents/MacOS/Mira
          ( "$app" --video-probe "$PWD/.artifacts/media/test.mkv" > .artifacts/probe.log 2>&1 & pid=$!; for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done; kill $pid 2>/dev/null ) || true
          grep -a -i -E "probe|opengl|gpu|metal|exception" .artifacts/probe.log | head -30 || true
      # Small JPEG copies of the captures, in base64, to review them without downloading the artifact.
      # Lines read: MIRA-PREVIEW <name> <part>/<parts> <base64>.
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/check/*.png .artifacts/dmg/dmg-*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            sips -s format jpeg -s formatOptions 45 -Z 720 "$file" --out "$small" >/dev/null
            data=$(base64 -i "$small" | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW $name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mira-mac-check
          path: |
            .artifacts/check
            .artifacts/check.log
            .artifacts/dmg
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mira-mac-arm64
          path: |
            dist/mac/*.dmg
            dist/mac/*.dmg.sha256
          retention-days: 14
  release:
    # The draft tools/release.ps1 made gets its Mac disk image here, built from the draft's commit and checked above.
    if: inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mira-mac-arm64
          path: mac
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "release or commit invalid" >&2; exit 1; }
          dmg="Mira-${RELEASE#v}-mac-arm64.dmg"
          # The disk image and its SHA-256, checked against each other once more before they go out together.
          (cd mac && sha256sum --strict -c -- "$dmg.sha256")
          # Only the draft made for this very commit: never a published release, nor a draft made since for another.
          state=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[(.isDraft | tostring), .targetCommitish] | join(" ")')
          [ "$state" = "true $COMMIT" ] || { echo "$RELEASE is not a draft for $COMMIT (found: $state)" >&2; exit 1; }
          # Never --clobber: a fresh draft holds none of these files, and one already there must stop the upload.
          gh release upload "$RELEASE" "mac/$dmg" "mac/$dmg.sha256" --repo "$GITHUB_REPOSITORY"
