name: Dune stills (temporary)
# One-off: the TMDb backdrops of Dune for the showcase site, as Jellyfin lists them, committed to this branch to pick
# one. Removed before the pull request is merged.
on:
  push:
    branches: [claude/project-thread-d1obqk]
    paths: [.github/workflows/stills.yml]
permissions:
  contents: write
jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Jellyfin with Dune
        run: |
          docker pull -q jellyfin/jellyfin:12.1.20260915-010956
          echo pulled
          for t in "Dune (2021)" "Dune Part Two (2024)"; do
            mkdir -p ".artifacts/media/Films/$t"
            timeout 60 docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg -v "$PWD/.artifacts/media:/media" jellyfin/jellyfin:12.1.20260915-010956 \
              -nostdin -loglevel error -y -f lavfi -t 5 -i color=c=black:s=640x360:r=1 "/media/Films/$t/$t.mkv"
          done
          ls -lR .artifacts/media
          docker run -d --name jellyfin --network host -v "$PWD/.artifacts/media:/media:ro" jellyfin/jellyfin:12.1.20260915-010956
      - name: Backdrops
        run: |
          cat > .artifacts/stills.mjs <<'JS'
          import { writeFileSync, mkdirSync } from 'node:fs';
          const base = 'http://127.0.0.1:8096', sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const auth = (t) => `MediaBrowser Client="stills", Device="CI", DeviceId="stills", Version="1.0"${t ? `, Token="${t}"` : ''}`;
          async function call(method, path, token, body) {
            for (const limit = Date.now() + 180_000; ; await sleep(2000)) {
              let r; try { r = await fetch(`${base}/${path}`, { method, headers: { Authorization: auth(token), 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) }); } catch { continue; }
              if ((r.status === 503 || /text\/html/.test(r.headers.get('content-type') ?? '')) && Date.now() < limit) continue;
              if (!r.ok) throw new Error(`${method} ${path}: ${r.status}`);
              const text = await r.text(); return text ? JSON.parse(text) : null;
            }
          }
          await call('POST', 'Startup/Configuration', null, { UICulture: 'en-US', MetadataCountryCode: 'US', PreferredMetadataLanguage: 'en' });
          await call('GET', 'Startup/User');
          await call('POST', 'Startup/User', null, { Name: 'a', Password: 'b' });
          await call('POST', 'Startup/Complete');
          const { AccessToken: token, User: { Id: user } } = await call('POST', 'Users/AuthenticateByName', null, { Username: 'a', Pw: 'b' });
          await call('POST', 'Library/VirtualFolders?name=Films&collectionType=movies&paths=%2Fmedia%2FFilms&refreshLibrary=true', token, { LibraryOptions: {} });
          let films = [];
          for (let i = 0; i < 100 && films.filter((f) => f.ProviderIds?.Tmdb).length < 2; i++) {
            await sleep(3000);
            films = (await call('GET', `Items?userId=${user}&recursive=true&includeItemTypes=Movie&fields=ProviderIds`, token)).Items ?? [];
          }
          mkdirSync('stills/dune', { recursive: true });
          const list = [];
          for (const film of films) {
            const images = (await call('GET', `Items/${film.Id}/RemoteImages?type=Backdrop&includeAllLanguages=true&limit=40`, token)).Images ?? [];
            console.log(film.Name, images.length);
            for (const [n, image] of images.slice(0, 24).entries()) {
              const r = await fetch(image.Url.replace('/original/', '/w1280/'));
              if (!r.ok) continue;
              const name = `${film.ProductionYear}-${String(n).padStart(2, '0')}.jpg`;
              writeFileSync(`stills/dune/${name}`, Buffer.from(await r.arrayBuffer()));
              list.push(`${name} ${image.Width}x${image.Height} ${image.Language ?? '-'} ${image.CommunityRating ?? ''} ${image.Url}`);
            }
          }
          writeFileSync('stills/dune/list.txt', list.join('\n') + '\n');
          JS
          timeout 900 node .artifacts/stills.mjs
      - name: Commit
        run: |
          git add stills
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Dune stills to pick from (temporary)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
