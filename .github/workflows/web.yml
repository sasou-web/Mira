name: Web build
# Mira's extension for Jellyfin (src/Mira.Jellyfin): packaged, installed from its repository on a real Jellyfin (12.1,
# 12.4, and the 10.9 and 10.10 the README promises) and checked through its API as Mira for Windows, Mac and iPhone use
# it; attached to the draft of each release, which tools/release.ps1 publishes once every platform is there. (Mira web,
# which it served until 0.9.3, is gone: /Mira now sends to the apps.)
on:
  push:
    branches: [main]
    paths: ["src/Mira.Jellyfin/**", "tools/web/**", "tools/extension/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/Mira.Jellyfin/**", "tools/web/**", "tools/extension/**", ".github/workflows/web.yml"]
  # The newest Jellyfin, which nothing pins: a 12.x that breaks the plugin shows here before a friend runs into it.
  schedule:
    - cron: "17 5 * * 1"
  # No "release: published": GitHub runs nothing for a draft, and an immutable release takes no file once published.
  workflow_dispatch:
    inputs:
      release:
        description: "Draft release to attach the extension to (vX.Y.Z), without the checks; set by tools/release.ps1"
        required: false
        type: string
      commit:
        description: "Commit that draft targets (40 hexadecimal characters); set by tools/release.ps1"
        required: false
        type: string
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  extension:
    # The plugin as Jellyfin installs it, against Jellyfin's own Docker image, on each version Mira claims to work with:
    # 10.9 and 10.10 (.NET 8, what the plugin is built for), 12.1 (the one Mira for Windows installs) and the newest
    # 12.x. Pinned by tag, moved by hand; `latest` follows Jellyfin and only fails the weekly run.
    # Not for a release's draft: its commit was checked on its way to main.
    if: inputs.release == ''
    name: Extension · Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.follows && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jellyfin: "10.9", image: "jellyfin/jellyfin:10.9.11", follows: false }
          - { jellyfin: "10.10", image: "jellyfin/jellyfin:10.10.7", follows: false }
          - { jellyfin: "12.1", image: "jellyfin/jellyfin:12.1.20260915-010956", follows: false }
          - { jellyfin: "12.4", image: "jellyfin/jellyfin:12.4.20261026-211555", follows: false }
          - { jellyfin: "latest", image: "jellyfin/jellyfin:latest", follows: true }
    env:
      JELLYFIN_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Scripts parse
        run: for f in src/Mira.Jellyfin/Pages/*.js tools/web/*.mjs tools/extension/*.mjs; do node --experimental-default-type=module --check "$f"; done
      - name: Package the plugin and a local repository
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Jellyfin/Mira.Jellyfin.csproj)
          tools/web/package.sh "$version" http://127.0.0.1:8765
      # ffmpeg: imageio-ffmpeg's static build from PyPI, pinned by its hash, as tools/player-check.ps1 takes it on
      # Windows. Not apt: the runner has no ffmpeg, and the Ubuntu mirror sometimes sends its 92 MB at 76 kB/s (20 min).
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          echo 'imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282' > "$RUNNER_TEMP/ffmpeg.txt"
          python3 -m pip install --disable-pip-version-check --quiet --no-deps --only-binary ':all:' --require-hashes --target "$RUNNER_TEMP/ffmpeg" -r "$RUNNER_TEMP/ffmpeg.txt"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(ls "$RUNNER_TEMP"/ffmpeg/imageio_ffmpeg/binaries/ffmpeg-linux-x86_64-*)" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ffmpeg" -hide_banner -version | head -1
      - name: Test media
        timeout-minutes: 5
        run: tools/web/media.sh "$PWD/.artifacts/media"
      - name: Jellyfin ${{ matrix.jellyfin }}, the extension installed from its repository
        run: |
          (cd dist/web && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          mkdir -p .artifacts/jf-config/plugins/FakeTvdb_9999.0.0.0 .artifacts/jf-cache
          # A stand-in for TheTVDB's plugin (out of reach): the missing episodes and air dates of the test series.
          dotnet build tools/web/fake-tvdb/FakeTvdb.csproj -c Release -o .artifacts/fake-tvdb
          cp .artifacts/fake-tvdb/Jellyfin.Plugin.FakeTvdb.dll .artifacts/jf-config/plugins/FakeTvdb_9999.0.0.0/
          docker run -d --name jellyfin --network host -v "$PWD/.artifacts/media:/media:ro" -v "$PWD/.artifacts/jf-config:/config" -v "$PWD/.artifacts/jf-cache:/cache" "$JELLYFIN_IMAGE"
          node tools/web/setup.mjs http://127.0.0.1:8096 /media mira mira-check http://127.0.0.1:8765/jellyfin-manifest.json
      # The extension through its API, as Mira for Windows, Mac and iPhone use it, and its pages (/Mira, a party's).
      - name: Check the extension
        run: node tools/extension/check.mjs http://127.0.0.1:8096 mira mira-check .artifacts/check/extension
      - name: Jellyfin log
        if: failure()
        run: |
          docker logs jellyfin 2>&1 | grep -E 'SyncPlay' | tail -120
          docker logs jellyfin 2>&1 | tail -80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Mira-extension-check-${{ matrix.jellyfin }}
          # A re-run of this job (tools/release.ps1 re-runs what failed) replaces the earlier attempt's copy.
          overwrite: true
          path: .artifacts/check
          retention-days: 7

  package:
    # The draft tools/release.ps1 made gets the plugin and the repository manifest Jellyfin installs it from,
    # built from the draft's commit. No write access here: the next job attaches them.
    if: inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The draft and its commit, checked before anything uses them; they reach scripts through env only.
      - name: Release inputs
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: vX.Y.Z expected, got '$RELEASE'" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit: 40 hexadecimal characters expected, got '$COMMIT'" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Package for this release
        env:
          RELEASE: ${{ inputs.release }}
        run: tools/web/package.sh "${RELEASE#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mira-web-release
          # A re-run of this job (tools/release.ps1 re-runs what failed) replaces the earlier attempt's copy.
          overwrite: true
          path: |
            dist/web/*.zip
            dist/web/jellyfin-manifest.json
          retention-days: 7

  release:
    if: inputs.release != ''
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The script that attaches the files, from the draft's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          sparse-checkout: tools/attach-to-draft.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mira-web-release
          path: web
      # A build attestation for each file: anyone can check, with `gh attestation verify <file> -R sasou-web/Mira`, that
      # it was built by this workflow from this commit (wiki: Verify your download).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            web/mira-jellyfin-*.zip
            web/jellyfin-manifest.json
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "release or commit invalid" >&2; exit 1; }
          # Only the draft made for this very commit; again safe on a re-run (tools/attach-to-draft.sh).
          tools/attach-to-draft.sh "$RELEASE" "$COMMIT" "web/mira-jellyfin-${RELEASE#v}.zip" web/jellyfin-manifest.json
