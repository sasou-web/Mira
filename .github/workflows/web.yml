name: Web build
# Mira web (src/Mira.Web), served by Jellyfin through Mira's plugin (src/Mira.Jellyfin): packaged, installed from its
# repository on a real Jellyfin (12.1, 12.4, and the 10.9 and 10.10 the README promises), checked in Chromium at an
# iPhone's size, and in Safari on 12.1; attached to the draft of each release, which tools/release.ps1 publishes once
# every platform is there.
on:
  push:
    branches: [main]
    paths: ["src/Mira.Web/**", "src/Mira.Jellyfin/**", "tools/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/Mira.Web/**", "src/Mira.Jellyfin/**", "tools/web/**", ".github/workflows/web.yml"]
  # The newest Jellyfin, which nothing pins: a 12.x that breaks the plugin shows here before a friend runs into it.
  schedule:
    - cron: "17 5 * * 1"
  # No "release: published": GitHub runs nothing for a draft, and an immutable release takes no file once published.
  workflow_dispatch:
    inputs:
      release:
        description: "Draft release to attach Mira web to (vX.Y.Z), without the checks; set by tools/release.ps1"
        required: false
        type: string
      commit:
        description: "Commit that draft targets (40 hexadecimal characters); set by tools/release.ps1"
        required: false
        type: string
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  chromium:
    # The plugin as Jellyfin installs it, and the whole app against Jellyfin's own Docker image, on each version Mira
    # claims to work with: 10.9 and 10.10 (.NET 8, what the plugin is built for), 12.1 (the one Mira for Windows
    # installs) and the newest 12.x. Pinned by tag, moved by hand; `latest` follows Jellyfin and only fails the weekly run.
    # Not for a release's draft: its commit was checked on its way to main.
    if: inputs.release == ''
    name: Chromium · Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.follows && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jellyfin: "10.9", image: "jellyfin/jellyfin:10.9.11", follows: false }
          - { jellyfin: "10.10", image: "jellyfin/jellyfin:10.10.7", follows: false }
          - { jellyfin: "12.1", image: "jellyfin/jellyfin:12.1.20260915-010956", follows: false }
          - { jellyfin: "12.4", image: "jellyfin/jellyfin:12.4.20261026-211555", follows: false }
          - { jellyfin: "latest", image: "jellyfin/jellyfin:latest", follows: true }
    env:
      JELLYFIN_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Scripts parse
        run: for f in src/Mira.Web/js/*.js src/Mira.Web/js/*/*.js tools/web/*.mjs tools/web/unit/*.mjs; do node --experimental-default-type=module --check "$f"; done
      # The player's decisions (the cascade, the addresses, the tracks, the timeline) in Node, before any browser.
      - name: Unit tests
        run: node --test tools/web/unit/*.test.mjs
      - name: Package the plugin and a local repository
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Jellyfin/Mira.Jellyfin.csproj)
          tools/web/package.sh "$version" http://127.0.0.1:8765
      # ffmpeg: imageio-ffmpeg's static build from PyPI, pinned by its hash, as tools/player-check.ps1 takes it on
      # Windows. Not apt: the runner has no ffmpeg, and the Ubuntu mirror sometimes sends its 92 MB at 76 kB/s (20 min).
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          echo 'imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282' > "$RUNNER_TEMP/ffmpeg.txt"
          python3 -m pip install --disable-pip-version-check --quiet --no-deps --only-binary ':all:' --require-hashes --target "$RUNNER_TEMP/ffmpeg" -r "$RUNNER_TEMP/ffmpeg.txt"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(ls "$RUNNER_TEMP"/ffmpeg/imageio_ffmpeg/binaries/ffmpeg-linux-x86_64-*)" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ffmpeg" -hide_banner -version | head -1
      - name: Test media
        timeout-minutes: 5
        run: tools/web/media.sh "$PWD/.artifacts/media"
      - name: Jellyfin ${{ matrix.jellyfin }}, Mira web installed from the repository
        run: |
          (cd dist/web && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          mkdir -p .artifacts/jf-config/plugins/FakeTvdb_9999.0.0.0 .artifacts/jf-cache
          # A stand-in for TheTVDB's plugin (out of reach): the missing episodes and air dates of the test series.
          dotnet build tools/web/fake-tvdb/FakeTvdb.csproj -c Release -o .artifacts/fake-tvdb
          cp .artifacts/fake-tvdb/Jellyfin.Plugin.FakeTvdb.dll .artifacts/jf-config/plugins/FakeTvdb_9999.0.0.0/
          docker run -d --name jellyfin --network host -v "$PWD/.artifacts/media:/media:ro" -v "$PWD/.artifacts/jf-config:/config" -v "$PWD/.artifacts/jf-cache:/cache" "$JELLYFIN_IMAGE"
          node tools/web/setup.mjs http://127.0.0.1:8096 /media mira mira-check http://127.0.0.1:8765/jellyfin-manifest.json
      - name: Check in Chromium
        run: |
          npm install --silent --no-audit --no-fund --prefix .artifacts/pw playwright@1.56.1
          npx --prefix .artifacts/pw playwright install --with-deps chromium >/dev/null
          # Jellyfin stopped then started again during the check: Mira web must open meanwhile and come back by itself.
          export MIRA_STOP="docker stop jellyfin" MIRA_START="docker start jellyfin"
          PLAYWRIGHT="$PWD/.artifacts/pw/node_modules/playwright/index.mjs" node tools/web/check.mjs http://127.0.0.1:8096/Mira/ mira mira-check "Courte Web" .artifacts/check
      - name: Jellyfin log
        if: failure()
        # « Regarder ensemble » happens long before the end: its SyncPlay lines, wherever they are, then the end.
        run: |
          docker logs jellyfin 2>&1 | grep -E 'SyncPlay' | tail -120
          docker logs jellyfin 2>&1 | tail -80
      # Small JPEG copies of the captures, in base64, to review them without downloading the artifact.
      # Lines read: MIRA-PREVIEW <name> <part>/<parts> <base64>.
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/check/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            ffmpeg -loglevel error -y -i "$file" -vf "scale='min(720,iw)':-2" -q:v 9 "$small"
            data=$(base64 -w0 "$small"); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW $name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Mira-web-check-${{ matrix.jellyfin }}
          path: .artifacts/check
          retention-days: 7

  safari:
    # Safari itself, on a Mac: WebKit and Apple's video engine play Jellyfin's HLS as an iPhone does.
    if: inputs.release == ''
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: ffmpeg
        run: brew install ffmpeg
      - name: Jellyfin 12.1 from its sources
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: Package the plugin and a local repository
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Jellyfin/Mira.Jellyfin.csproj)
          tools/web/package.sh "$version" http://127.0.0.1:8765
      - name: Jellyfin, Mira web installed from the repository
        run: |
          tools/web/media.sh "$PWD/.artifacts/media" formats
          (cd dist/web && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          j=.artifacts/jf-data; mkdir -p $j/data $j/cache $j/config $j/log
          (dotnet .artifacts/jf/jellyfin.dll --datadir $j/data --cachedir $j/cache --configdir $j/config --logdir $j/log --nowebclient --ffmpeg "$(brew --prefix)/bin/ffmpeg" > .artifacts/jellyfin.log 2>&1 &)
          node tools/web/setup.mjs http://127.0.0.1:8096 "$PWD/.artifacts/media" mira mira-check http://127.0.0.1:8765/jellyfin-manifest.json
      - name: Check in Safari
        run: |
          sudo safaridriver --enable
          (safaridriver -p 4444 > .artifacts/safaridriver.log 2>&1 &)
          # On a fresh runner, safaridriver may take more than a few seconds to listen: wait for it, 30 s at most.
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4444/status && break; sleep 1; done
          MIRA_FORMATS=1 node tools/web/safari.mjs http://127.0.0.1:8096/Mira/ mira mira-check .artifacts/safari
      - name: Jellyfin log
        if: failure()
        run: tail -80 .artifacts/jellyfin.log; ls -t .artifacts/jf-data/log/FFmpeg* 2>/dev/null | head -1 | xargs -I{} tail -30 {}
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/safari/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            sips -s format jpeg -s formatOptions 45 -Z 720 "$file" --out "$small" >/dev/null
            data=$(base64 -i "$small" | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW safari-$name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Mira-web-safari
          path: .artifacts/safari
          retention-days: 7

  package:
    # The draft tools/release.ps1 made gets Mira web's plugin and the repository manifest Jellyfin installs it from,
    # built from the draft's commit. No write access here: the next job attaches them.
    if: inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The draft and its commit, checked before anything uses them; they reach scripts through env only.
      - name: Release inputs
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release: vX.Y.Z expected, got '$RELEASE'" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit: 40 hexadecimal characters expected, got '$COMMIT'" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Package for this release
        env:
          RELEASE: ${{ inputs.release }}
        run: tools/web/package.sh "${RELEASE#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mira-web-release
          path: |
            dist/web/*.zip
            dist/web/jellyfin-manifest.json
          retention-days: 7

  release:
    if: inputs.release != ''
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mira-web-release
          path: web
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "release or commit invalid" >&2; exit 1; }
          # Only the draft made for this very commit: never a published release, nor a draft made since for another.
          state=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[(.isDraft | tostring), .targetCommitish] | join(" ")')
          [ "$state" = "true $COMMIT" ] || { echo "$RELEASE is not a draft for $COMMIT (found: $state)" >&2; exit 1; }
          # Never --clobber: a fresh draft holds none of these files, and one already there must stop the upload.
          gh release upload "$RELEASE" "web/mira-jellyfin-${RELEASE#v}.zip" web/jellyfin-manifest.json --repo "$GITHUB_REPOSITORY"
