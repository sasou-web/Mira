name: Web build
# Mira web (src/Mira.Web), served by Jellyfin through Mira's plugin (src/Mira.Jellyfin): packaged, installed from its
# repository on a real Jellyfin 12.1, checked in Chromium at an iPhone's size and in Safari, attached to each release.
on:
  push:
    branches: [main]
    paths: ["src/Mira.Web/**", "src/Mira.Jellyfin/**", "tools/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/Mira.Web/**", "src/Mira.Jellyfin/**", "tools/web/**", ".github/workflows/web.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  JELLYFIN_IMAGE: jellyfin/jellyfin:12.1.20260915-010956
jobs:
  chromium:
    # The plugin as Jellyfin installs it, and the whole app against Jellyfin's own Docker image.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Scripts parse
        run: for f in src/Mira.Web/js/*.js src/Mira.Web/js/*/*.js tools/web/*.mjs; do node --experimental-default-type=module --check "$f"; done
      - name: Package the plugin and a local repository
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Jellyfin/Mira.Jellyfin.csproj)
          tools/web/package.sh "$version" http://127.0.0.1:8765
      - name: Test media
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          tools/web/media.sh "$PWD/.artifacts/media"
      - name: Jellyfin 12.1, Mira web installed from the repository
        run: |
          (cd dist/web && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          mkdir -p .artifacts/jf-config .artifacts/jf-cache
          docker run -d --name jellyfin --network host -v "$PWD/.artifacts/media:/media:ro" -v "$PWD/.artifacts/jf-config:/config" -v "$PWD/.artifacts/jf-cache:/cache" "$JELLYFIN_IMAGE"
          node tools/web/setup.mjs http://127.0.0.1:8096 /media mira mira-check http://127.0.0.1:8765/jellyfin-manifest.json
      - name: Check in Chromium
        run: |
          npm install --silent --no-audit --no-fund --prefix .artifacts/pw playwright@1.56.1
          npx --prefix .artifacts/pw playwright install --with-deps chromium >/dev/null
          PLAYWRIGHT="$PWD/.artifacts/pw/node_modules/playwright/index.mjs" node tools/web/check.mjs http://127.0.0.1:8096/Mira/ mira mira-check "Courte Web" .artifacts/check
      - name: Jellyfin log
        if: failure()
        run: docker logs jellyfin 2>&1 | tail -80
      # Small JPEG copies of the captures, in base64, to review them without downloading the artifact.
      # Lines read: MIRA-PREVIEW <name> <part>/<parts> <base64>.
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/check/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            ffmpeg -loglevel error -y -i "$file" -vf "scale='min(720,iw)':-2" -q:v 9 "$small"
            data=$(base64 -w0 "$small"); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW $name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mira-web-check
          path: .artifacts/check
          retention-days: 7

  safari:
    # Safari itself, on a Mac: WebKit and Apple's video engine play Jellyfin's HLS as an iPhone does.
    if: github.event_name != 'release'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: ffmpeg
        run: brew install ffmpeg
      - name: Jellyfin 12.1 from its sources
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: Package the plugin and a local repository
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mira.Jellyfin/Mira.Jellyfin.csproj)
          tools/web/package.sh "$version" http://127.0.0.1:8765
      - name: Jellyfin, Mira web installed from the repository
        run: |
          tools/web/media.sh "$PWD/.artifacts/media"
          (cd dist/web && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          j=.artifacts/jf-data; mkdir -p $j/data $j/cache $j/config $j/log
          (dotnet .artifacts/jf/jellyfin.dll --datadir $j/data --cachedir $j/cache --configdir $j/config --logdir $j/log --nowebclient --ffmpeg "$(brew --prefix)/bin/ffmpeg" > .artifacts/jellyfin.log 2>&1 &)
          node tools/web/setup.mjs http://127.0.0.1:8096 "$PWD/.artifacts/media" mira mira-check http://127.0.0.1:8765/jellyfin-manifest.json
      - name: Check in Safari
        run: |
          sudo safaridriver --enable
          (safaridriver -p 4444 > .artifacts/safaridriver.log 2>&1 &)
          sleep 2
          node tools/web/safari.mjs http://127.0.0.1:8096/Mira/ mira mira-check .artifacts/safari
      - name: Jellyfin log
        if: failure()
        run: tail -80 .artifacts/jellyfin.log; ls -t .artifacts/jf-data/log/FFmpeg* 2>/dev/null | head -1 | xargs -I{} tail -30 {}
      - name: Capture previews in the log
        if: always()
        run: |
          for file in .artifacts/safari/*.png; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .png); small=".artifacts/$name.jpg"
            sips -s format jpeg -s formatOptions 45 -Z 720 "$file" --out "$small" >/dev/null
            data=$(base64 -i "$small" | tr -d '\n'); parts=$(( (${#data} + 3999) / 4000 ))
            for ((i = 0; i < parts; i++)); do echo "MIRA-PREVIEW safari-$name $((i + 1))/$parts ${data:$((i * 4000)):4000}"; done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mira-web-safari
          path: .artifacts/safari
          retention-days: 7

  release:
    # The release published from the PC gets Mira web's plugin and the repository manifest Jellyfin installs it from.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Package for this release
        run: tools/web/package.sh "${GITHUB_REF_NAME#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/web/*.zip dist/web/jellyfin-manifest.json --clobber --repo "${{ github.repository }}"
