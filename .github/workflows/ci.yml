name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      previews:
        description: "Captures to print in the log as small JPEG previews (names or wildcards, comma-separated)"
        required: false
        default: ""
      preview_width:
        description: "Width of each preview in pixels"
        required: false
        default: "480"
      preview_quality:
        description: "JPEG quality of each preview, 1 to 100 (a capture to look at closely: 90)"
        required: false
        default: "50"
permissions:
  contents: read
jobs:
  # The checks free of WPF (Mira.Core, the update code, the plugin's web files, the Mac profile) on Linux: what is not
  # tied to Windows is seen to run elsewhere too, in a minute.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/Mira.Core.Tests/Mira.Core.Tests.csproj --configfile NuGet.Config
      - name: Build
        run: dotnet build tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-restore
      # Mira for Mac compiles here too (Avalonia builds on Linux): a pull request that changes only Mira.Core no longer
      # starts mac.yml, so a change that breaks the Mac app's build is seen here, on the pull request, in a minute.
      - name: Mira for Mac compiles
        run: |
          dotnet restore src/Mira.Mac/Mira.Mac.csproj --configfile NuGet.Config
          dotnet build src/Mira.Mac/Mira.Mac.csproj -c Release --no-restore
      # The real qBittorrent for its Web API under Mira's profile, settings and password: Ubuntu's qbittorrent-nox (4.6),
      # then a 5.3.0 like the one Mira installs on Windows, which answers sign-in otherwise (204, not « Ok. »: Mira's
      # 0.9.1 knew only 4.6 and took 5.3's answer for a refused password). Neither Ubuntu nor the qBittorrent team's PPA
      # has a 5.x for this runner: the static build the qBittorrent wiki points to, its SHA-256 pinned.
      - name: qBittorrent
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qbittorrent-nox
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/qbittorrent-nox-5" https://github.com/userdocs/qbittorrent-nox-static/releases/download/release-5.3.0_v2.0.15/x86_64-qbittorrent-nox
          echo "501202c16dff9b2486b91ae52f15e06e2027affdda514e70bb552d3833e31696  $RUNNER_TEMP/qbittorrent-nox-5" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/qbittorrent-nox-5"
          qbittorrent-nox --version
          "$RUNNER_TEMP/qbittorrent-nox-5" --version
      - name: Tests free of WPF (Linux)
        env:
          MIRA_QBITTORRENT: /usr/bin/qbittorrent-nox
        run: dotnet run --project tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-build
      - name: The real qBittorrent 5.3.0
        run: MIRA_QBITTORRENT="$RUNNER_TEMP/qbittorrent-nox-5" dotnet run --project tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-build -- --filter "le vrai, dans le profil"
  # Mira's own Tailscale node (src/Mira.Tailscale), built with the tags of the helper the apps ship (logs to Tailscale
  # compiled out): its tests start a whole Tailscale network in the process (control, relay, the Jellyfin PC) and sign
  # a node in as the apps do; then the helper is built for Windows and Mac. Last, Mira.Core against the real helper on
  # mira-testnet's network: sign-in, discovery, requests, WebSocket and mpv through the node, the PC off, a key expired.
  tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Mira.Tailscale
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/Mira.Tailscale/go.mod
          cache-dependency-path: src/Mira.Tailscale/go.sum
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not formatted by gofmt: $unformatted"; exit 1; fi
      - name: go.mod and go.sum as go mod tidy writes them
        run: go mod tidy -diff
      - name: Vet
        run: go vet -tags "$(cat build-tags.txt)" ./...
      - name: Tests (a Tailscale network in the process)
        run: go test -race -tags "$(cat build-tags.txt)" ./...
      - name: Helper for Windows and Mac
        run: |
          for target in windows/amd64 windows/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -tags "$(cat build-tags.txt)" -o /dev/null ./cmd/mira-tailscale
            echo "mira-tailscale builds for $target"
          done
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: libmpv, for the player through the node
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmpv2
      - name: Mira's network through the real helper (tests/Mira.Core.Tests)
        env:
          MIRA_TAILNET_HELPER: ${{ runner.temp }}/mira-tailscale
          MIRA_TAILNET_TESTNET: ${{ runner.temp }}/mira-testnet
          MIRA_TAILNET_MPV: /usr/lib/x86_64-linux-gnu/libmpv.so.2
        run: |
          CGO_ENABLED=0 go build -trimpath -tags "$(cat build-tags.txt)" -ldflags "-X main.version=test" -o "$MIRA_TAILNET_HELPER" ./cmd/mira-tailscale
          CGO_ENABLED=0 go build -trimpath -tags "$(cat build-tags.txt)" -o "$MIRA_TAILNET_TESTNET" ./cmd/mira-testnet
          cd ../..
          dotnet restore tests/Mira.Core.Tests/Mira.Core.Tests.csproj --configfile NuGet.Config
          dotnet run --project tests/Mira.Core.Tests/Mira.Core.Tests.csproj -c Release --no-restore -- --filter "Tailscale intégré"
  build:
    runs-on: windows-latest
    # About 8 minutes, a few more when Go's cache is cold (a new go.sum).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      # Layout as .editorconfig describes it, in every C# file of the repository (Windows, Mac, plugin, tools).
      - name: Code format
        run: dotnet format whitespace . --folder --verify-no-changes
      # The scripts run on the publishing PC, in Windows PowerShell 5.1 (the one Windows starts) or PowerShell 7: both
      # read them here, encoding and syntax, as they would there.
      - name: PowerShell scripts read by Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Path tools -Filter *.ps1 -Recurse) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Output "$($script.Name): $_" } }
          }
          if ($failed) { exit 1 }
          Write-Output "Windows PowerShell $($PSVersionTable.PSVersion): every script reads."
      - name: PowerShell scripts read by PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Path tools -Filter *.ps1 -Recurse) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Output "$($script.Name): $_" } }
          }
          if ($failed) { exit 1 }
          Write-Output "PowerShell $($PSVersionTable.PSVersion): every script reads."
      # tools/release.ps1 against a stand-in GitHub, in the Windows PowerShell of the publishing PC: ci.yml still running,
      # failed workflows re-run on their own, a launch stopped then picked up, a wrong file on the draft attached again.
      - name: Release script against a stand-in GitHub
        shell: powershell
        run: ./tools/release-check.ps1
      # Built-in Tailscale's node (src/Mira.Tailscale), as packages carry it: Mira.Desktop.csproj puts it beside Mira.exe
      # with its SHA-256. The runner's Go fetches the version go.mod asks for; modules and builds are kept between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ hashFiles('src/Mira.Tailscale/go.sum', 'tools/tailscale/winres/go.sum') }}
      - name: Built-in Tailscale's node
        run: node tools/tailscale/build.mjs windows/amd64 .artifacts/tailscale/windows-amd64
      - name: Restore
        run: dotnet restore Mira.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build Mira.sln -c Release --no-restore
      # Every check: those free of WPF (tests/Mira.Core.Tests, also run on Linux by the portable job), then those of the Windows app.
      - name: Behaviour and persistence tests
        run: dotnet run --project tests/Mira.Tests/Mira.Tests.csproj -c Release --no-build
      # The real window, offline demo only: every main screen is rendered once and kept as an image for review.
      - name: Interface captures (offline demo)
        shell: pwsh
        run: |
          $exe = 'src/Mira.Desktop/bin/Release/net10.0-windows10.0.19041.0/Mira.exe'
          $output = Join-Path $PWD '.artifacts/interface'
          $profile = Join-Path $PWD '.artifacts/interface-profile'
          $run = Start-Process -FilePath $exe -ArgumentList @('--demo', '--data', "`"$profile`"", '--public-gallery', "`"$output`"") -PassThru
          if (-not $run.WaitForExit(240000)) { $run.Kill(); throw 'The interface captures did not finish within 4 minutes.' }
          $result = Get-Content -LiteralPath (Join-Path $output 'gallery-result.txt') -Raw
          Write-Output $result
          $sizes = Join-Path $output 'sizes.txt'
          if (Test-Path -LiteralPath $sizes) { Get-Content -LiteralPath $sizes }
          if ($run.ExitCode -ne 0 -or $result -notlike 'PASS:*') { throw 'Interface captures failed.' }
      # The real player: libmpv as Mira installs it, a synthetic clip with chapters, the window off screen; its
      # captures join the interface's (tools/player-check.ps1). The archive is kept between runs (SourceForge).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .artifacts/player-work/libmpv.7z
          key: libmpv-${{ hashFiles('src/Mira.Core/MpvPackage.cs') }}
      - name: Real player (libmpv, synthetic clip)
        shell: pwsh
        run: ./tools/player-check.ps1 -Output .artifacts/interface
      # Mira left alone on its Home for 60 s: processor, memory and bytes written, in the log and the job's summary, to
      # see a drift from one version to the next (tools/idle-check.ps1). Numbers only: nothing fails on them.
      - name: Mira at rest (60 s)
        shell: pwsh
        run: ./tools/idle-check.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mira-interface
          path: .artifacts/interface/*.png
          retention-days: 7
      - name: Package without user data
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mira-win-x64
          path: dist/packages/*
          retention-days: 14
      # On request only (Run workflow → previews): small JPEG copies of chosen captures, in base64, for a review
      # without downloading the artifact. Lines read: MIRA-PREVIEW <name> <width>x<height> <part>/<parts> <base64>.
      - name: Interface previews in the log
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.previews != '' }}
        shell: pwsh
        env:
          PREVIEWS: ${{ inputs.previews }}
          PREVIEW_WIDTH: ${{ inputs.preview_width }}
          PREVIEW_QUALITY: ${{ inputs.preview_quality }}
        run: |
          Add-Type -AssemblyName System.Drawing
          $folder = Join-Path $PWD '.artifacts/interface'
          $sizes = Join-Path $folder 'sizes.txt'
          if (Test-Path -LiteralPath $sizes) { Get-Content -LiteralPath $sizes }
          $maximum = [int]($env:PREVIEW_WIDTH ?? '480'); if ($maximum -lt 160) { $maximum = 480 }
          $quality = [int]($env:PREVIEW_QUALITY ?? '50'); if ($quality -lt 1 -or $quality -gt 100) { $quality = 50 }
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $parameters = [System.Drawing.Imaging.EncoderParameters]::new(1)
          $parameters.Param[0] = [System.Drawing.Imaging.EncoderParameter]::new([System.Drawing.Imaging.Encoder]::Quality, [long]$quality)
          $patterns = $env:PREVIEWS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $files = Get-ChildItem -LiteralPath $folder -Filter '*.png' | Where-Object { $name = $_.BaseName; $patterns | Where-Object { $name -like $_ } } | Sort-Object Name
          foreach ($file in $files) {
            $image = [System.Drawing.Image]::FromFile($file.FullName)
            $width = [Math]::Min($maximum, $image.Width); $height = [int]($image.Height * $width / $image.Width)
            $small = [System.Drawing.Bitmap]::new($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($small); $graphics.InterpolationMode = 'HighQualityBicubic'; $graphics.DrawImage($image, 0, 0, $width, $height); $graphics.Dispose()
            $stream = [IO.MemoryStream]::new(); $small.Save($stream, $codec, $parameters); $small.Dispose()
            $data = [Convert]::ToBase64String($stream.ToArray()); $parts = [Math]::Ceiling($data.Length / 4000)
            for ($i = 0; $i -lt $parts; $i++) { Write-Output ("MIRA-PREVIEW {0} {1}x{2} {3}/{4} {5}" -f $file.BaseName, $image.Width, $image.Height, ($i + 1), $parts, $data.Substring($i * 4000, [Math]::Min(4000, $data.Length - $i * 4000))) }
            $image.Dispose()
          }
  # Mira for Windows against a real Jellyfin 12.1 on the runner, beside the build (tools/server-check.ps1): sign-in,
  # Home, a film streamed then converted, Jellyfin stopped under it and started again, « Garder sur ce PC » played
  # without Jellyfin, « Regarder ensemble » with a second device, « Mettre à la Corbeille », a party of that Jellyfin
  # joined as its guest (the extension built here); then « Tailscale intégré »
  # on a Tailscale network of the runner's own (mira-testnet), whose « Jellyfin PC » is that Jellyfin. Jellyfin is
  # compiled from its sources once and kept (actions/cache); the test media are those of Mira web's checks
  # (tools/web/media.sh).
  server:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: jellyfin
        with:
          path: .artifacts/jf
          key: jellyfin-v12.1-${{ runner.os }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.jellyfin.outputs.cache-hit != 'true'
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - name: Jellyfin 12.1 from its sources
        if: steps.jellyfin.outputs.cache-hit != 'true'
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: ffmpeg
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Test media
        shell: bash
        run: tools/web/media.sh "$PWD/.artifacts/media" > /dev/null
      # Built-in Tailscale's node, carried by Mira as packages carry it, and the test tailnet (src/Mira.Tailscale).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/Mira.Tailscale/go.mod
          cache-dependency-path: |
            src/Mira.Tailscale/go.sum
            tools/tailscale/winres/go.sum
      - name: Built-in Tailscale's node and the test tailnet
        shell: pwsh
        run: |
          node tools/tailscale/build.mjs windows/amd64 .artifacts/tailscale/windows-amd64
          if ($LASTEXITCODE -ne 0) { throw "The node did not build ($LASTEXITCODE)." }
          Push-Location src/Mira.Tailscale
          go build -trimpath -tags ((Get-Content build-tags.txt -Raw).Trim()) -o ../../.artifacts/tailscale/mira-testnet.exe ./cmd/mira-testnet
          if ($LASTEXITCODE -ne 0) { throw "mira-testnet did not build ($LASTEXITCODE)." }
          Pop-Location
      - name: Build Mira for Windows and the extension
        run: |
          dotnet restore src/Mira.Desktop/Mira.Desktop.csproj --configfile NuGet.Config
          dotnet build src/Mira.Desktop/Mira.Desktop.csproj -c Release --no-restore
          dotnet restore src/Mira.Jellyfin/Mira.Jellyfin.csproj --configfile NuGet.Config
          dotnet build src/Mira.Jellyfin/Mira.Jellyfin.csproj -c Release --no-restore
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .artifacts/server-work/libmpv.7z
          key: libmpv-${{ hashFiles('src/Mira.Core/MpvPackage.cs') }}
      - name: Mira against Jellyfin, then through Built-in Tailscale
        shell: pwsh
        run: ./tools/server-check.ps1 -Jellyfin .artifacts/jf -Testnet .artifacts/tailscale/mira-testnet.exe -Extension src/Mira.Jellyfin/bin/Release/net8.0/Mira.Jellyfin.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mira-server-check
          path: |
            .artifacts/server/*.png
            .artifacts/server/tailnet/*.png
          retention-days: 7
  # How smooth the pages are (tools/smooth-check.ps1): Mira signed in to a Jellyfin answered inside it, the wheel down
  # and up the pages, the rail's pages, a title's page and Settings, frame by frame, in the log and the job's summary.
  # The runner draws without a graphics card (WARP) on a small screen at 60 Hz: its numbers compare one commit with
  # another, never with a real PC. Nothing fails on them, only a check that could not run.
  smooth:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build Mira for Windows
        run: |
          dotnet restore src/Mira.Desktop/Mira.Desktop.csproj --configfile NuGet.Config
          dotnet build src/Mira.Desktop/Mira.Desktop.csproj -c Release --no-restore
      - name: Smoothness of the pages
        shell: pwsh
        run: |
          ./tools/smooth-check.ps1 -Output .artifacts/smooth/edge -Placement edge
          ./tools/smooth-check.ps1 -Output .artifacts/smooth/offscreen -Placement offscreen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mira-smooth
          path: |
            .artifacts/smooth/*/report.*
            .artifacts/smooth/*/summary.md
            .artifacts/smooth/*/*.jpg
          retention-days: 14
