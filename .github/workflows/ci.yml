name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Mira.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build Mira.sln -c Release --no-restore
      - name: Behaviour and persistence tests
        run: dotnet run --project tests/Mira.Tests/Mira.Tests.csproj -c Release --no-build
      - name: Package without user data
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mira-win-x64
          path: dist/packages/*
          retention-days: 14
