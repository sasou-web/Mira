name: Presentation tour
# TEMPORARY (never merged): films of the real Mira for Windows for the presentation video. Mira's clocks run six times
# slower (tools/tour/dilate.c) while ffmpeg films the screen, so that this runner, without a graphics card, draws every
# moment of every animation; the montage plays them back six times faster, at 60 frames a second. Committed to this
# branch under tour/ (artifacts are out of reach of the thread that edits the film).
on:
  push:
    branches: [claude/project-thread-31wz5d]
    paths: [.github/workflows/tour.yml, tools/tour/**, src/Mira.Desktop/Checks/MainWindow.Tour.cs, src/Mira.Desktop/Checks/TourDirector.cs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tour-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GALLERY_USER: Camille
  GALLERY_PASSWORD: mira-gallery
  GALLERY_LANGUAGE: en
  GALLERY_PLAYING: Blade Runner 2049 (2017)
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellyfin/jellyfin
          ref: v12.1
          path: .artifacts/jellyfin-src
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Jellyfin 12.1 from its sources
        working-directory: .artifacts/jellyfin-src
        run: dotnet publish Jellyfin.Server/Jellyfin.Server.csproj -c Release -o ../jf -p:DebugType=none -nologo -v q
      - name: The library
        shell: bash
        run: |
          tools/banner/media.sh "$PWD/.artifacts/media"
          echo "MIRA_GALLERY_TITLES=$(( $(find .artifacts/media -name '*.mkv' | wc -l) + $(ls .artifacts/media/Séries | wc -l) ))" >> "$GITHUB_ENV"
      - name: Jellyfin, its library and a viewer's traces
        shell: pwsh
        run: |
          $j = Join-Path $PWD '.artifacts/jf-data'
          foreach ($d in 'data', 'cache', 'config', 'log') { New-Item -ItemType Directory -Force -Path (Join-Path $j $d) | Out-Null }
          $ffmpeg = (Get-Command ffmpeg).Source
          Start-Process -FilePath dotnet -ArgumentList @('.artifacts/jf/jellyfin.dll', '--datadir', "$j/data", '--cachedir', "$j/cache", '--configdir', "$j/config", '--logdir', "$j/log", '--nowebclient', '--ffmpeg', $ffmpeg) -WindowStyle Hidden
          node tools/gallery/setup.mjs http://127.0.0.1:8096 (Join-Path $PWD '.artifacts/media') $env:GALLERY_USER $env:GALLERY_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw 'Jellyfin setup failed.' }
      # The film played: its backdrop, slowly drawn closer and back (the library's videos are black).
      - name: libmpv and a film made of its backdrop
        shell: bash
        run: |
          pwsh -NoProfile -File tools/mpv-engine.ps1 -Work .artifacts/player-work -ProfileFolder .artifacts/tour-profile
          MIRA_STILLS_ALL=1 node tools/banner/stills.mjs http://127.0.0.1:8096 "$GALLERY_USER" "$GALLERY_PASSWORD" .artifacts/stills
          name="$GALLERY_PLAYING"
          slug=$(echo "${name% (*}" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')
          file=".artifacts/media/Films/$name/$name.mkv"
          minutes=$(( $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$file" | cut -d. -f1) / 60 ))
          ffmpeg -loglevel error -y -loop 1 -framerate 24 -i ".artifacts/stills/backdrop-$slug.jpg" -f lavfi -i anullsrc=r=48000:cl=stereo -t 120 \
            -vf "scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,zoompan=z='1.07-0.07*cos(2*PI*on/2880)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1920x1080:fps=24,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 18 -g 48 -c:a aac -b:a 32k .artifacts/still-master.mkv
          ffmpeg -loglevel error -y -stream_loop -1 -i .artifacts/still-master.mkv -t $((minutes * 60)) -c copy -metadata:s:a:0 language=eng .artifacts/still-film.mkv
          mv -f .artifacts/still-film.mkv "$file"
      - name: Time dilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts | Out-Null
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if ($gcc) { & gcc -O2 -shared -static-libgcc -o .artifacts/mira-dilate.dll tools/tour/dilate.c; if ($LASTEXITCODE -ne 0) { exit 1 } }
          else {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /LD tools\tour\dilate.c /Fe.artifacts\mira-dilate.dll"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-Item .artifacts/mira-dilate.dll | Format-Table Name, Length
      - name: Build Mira for Windows
        run: |
          dotnet restore src/Mira.Desktop/Mira.Desktop.csproj --configfile NuGet.Config
          dotnet build src/Mira.Desktop/Mira.Desktop.csproj -c Release --no-restore
      # The film fills the screen: 1920 × 1080, no taskbar (Mira's pages zoomed by the tour itself, as on 1440 × 810).
      - name: The screen
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name AutoRestartShell -Value 0
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
      - name: The films
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src/Mira.Desktop/bin/Release/net10.0-windows*/Mira.exe'
          Copy-Item .artifacts/mira-dilate.dll (Split-Path $exe)
          $out = Join-Path $PWD 'tour/run'; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $profile = Join-Path $PWD '.artifacts/tour-profile'
          $env:MIRA_DILATE_DLL = Join-Path (Split-Path $exe) 'mira-dilate.dll'
          $env:MIRA_TOUR_FFMPEG = (Get-Command ffmpeg).Source
          $env:MIRA_GALLERY_SERVER = 'http://127.0.0.1:8096'; $env:MIRA_GALLERY_USER = $env:GALLERY_USER; $env:MIRA_GALLERY_PASSWORD = $env:GALLERY_PASSWORD
          $run = Start-Process -FilePath $exe -ArgumentList @('--data', "`"$profile`"", '--language', 'en', '--tour', "`"$out`"") -PassThru
          if (-not $run.WaitForExit(3000000)) { $run.Kill() }
          Get-ChildItem $out | Format-Table Name, Length
          foreach ($f in 'tour-result.txt', 'dilation.txt') { $p = Join-Path $out $f; if (Test-Path $p) { "== $f"; Get-Content $p -Raw } }
          Get-ChildItem $out -Filter *.ffmpeg.txt | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Raw }
          if (Test-Path (Join-Path $profile 'errors.log')) { Get-Content (Join-Path $profile 'errors.log') -Tail 60 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tour
          path: tour/run
          retention-days: 3

  commit:
    needs: [windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: tour
          path: tour/run
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          find tour -type f | sort; du -sh tour || exit 0
          git add -f tour
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Tour: the films (never merged) [skip ci]"
          git push origin "HEAD:$BRANCH"
