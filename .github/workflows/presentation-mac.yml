name: Presentation video pictures (Mac)
# TEMPORARY (never merged): Mira for Mac's screens for the presentation video, as banner.yml takes them (Mira --gallery
# on Linux under a virtual display, at ×2), on a Jellyfin 12.1 holding the README's library with its TMDb artwork and
# the viewer's traces of presentation/library.mjs. Committed to this branch (presentation/shots/shots-mac).
on:
  push:
    branches: [claude/project-thread-rh3c2j]
    paths: [.github/workflows/presentation-mac.yml, src/Mira.Mac/Checks/Gallery.cs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presentation-mac-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
jobs:
  mac:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: The library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb libgl1-mesa-dri > /dev/null
          presentation/media.sh "$PWD/.artifacts/media"
          echo "TITLES=$(( $(find .artifacts/media -name '*.mkv' | wc -l) + $(ls .artifacts/media/Séries | wc -l) ))" >> "$GITHUB_ENV"
      - name: Jellyfin 12.1, its library and a viewer's traces
        run: |
          mkdir -p .artifacts/jf/config .artifacts/jf/cache
          docker run -d --name jellyfin --network host --user "$(id -u):$(id -g)" -v "$PWD/.artifacts/jf/config:/config" -v "$PWD/.artifacts/jf/cache:/cache" \
            -v "$PWD/.artifacts/media:/media:ro" jellyfin/jellyfin:12.1.20260915-010956
          node presentation/library.mjs http://127.0.0.1:8096 /media/Films /media/Séries
      - name: Mira for Mac (Linux, virtual display, at ×2)
        run: |
          dotnet build src/Mira.Mac/Mira.Mac.csproj -c Release -nologo -v q
          dll=$(find src/Mira.Mac/bin/Release -name Mira.dll | head -1)
          export MIRA_GALLERY_SERVER=http://127.0.0.1:8096 MIRA_GALLERY_USER=Sam MIRA_GALLERY_PASSWORD=mira-demo MIRA_GALLERY_MORE=1 AVALONIA_GLOBAL_SCALE_FACTOR=2 LANG=en_US.UTF-8
          timeout 600 xvfb-run -a -s "-screen 0 3200x2000x24" dotnet "$dll" --data .artifacts/mac-profile --gallery .artifacts/out || true
          cat .artifacts/out/gallery-result.txt .artifacts/out/gallery-more.txt 2>/dev/null || true
          ls -la .artifacts/out
          grep -q '^PASS' .artifacts/out/gallery-result.txt
      - name: Jellyfin log
        if: failure()
        run: docker logs --tail 80 jellyfin
      - name: Commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git rm -r -q --ignore-unmatch presentation/shots/shots-mac > /dev/null
          mkdir -p presentation/shots; mv .artifacts/out presentation/shots/shots-mac
          git add -f presentation/shots/shots-mac
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Presentation: the Mac's pictures" || exit 0
          for attempt in 1 2 3; do git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break; sleep 5; done
