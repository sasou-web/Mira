name: Release banner
# The banner at the head of a release's page (tools/banner/): drawn from real captures of this version in English, on
# the README's library (tools/banner/media.sh, a real Jellyfin 12.1 with its TMDb artwork): Mira for Windows (the
# README's Windows job, gallery.yml), Mira for Mac (Mira --gallery under a virtual display, at ×2), Mira for iPhone (the
# README's iPhone job, gallery.yml), lit by a film's backdrop (tools/banner/stills.mjs). What it shows comes from tools/banner/scenes.json and
# the version's entry of WhatsNew.json (tools/banner/plan.mjs): a card per point for a patch, Mira on every screen
# for x.y.0. Run on request (Run workflow) from the release's preparation branch: docs/releases/<version>.jpg is
# committed to it, to reach main and the release's tag through its pull request; from main, only kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (x.y.z) whose banner to draw
        required: true
permissions:
  contents: read
concurrency:
  group: banner-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  JELLYFIN_IMAGE: jellyfin/jellyfin:12.1.20260915-010956
  GALLERY_USER: Camille
  GALLERY_PASSWORD: mira-gallery
  GALLERY_LANGUAGE: en
  VERSION: ${{ inputs.version }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
      mac: ${{ steps.plan.outputs.mac }}
      iphone: ${{ steps.plan.outputs.iphone }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: What the banner shows
        id: plan
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version: $VERSION"; exit 1; }
          node tools/banner/plan.mjs "$VERSION" | tee -a "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    # gallery.yml's commit job asks for it, even skipped.
    permissions:
      contents: write
    uses: ./.github/workflows/gallery.yml
    with:
      language: en
      windows_only: true

  iphone:
    needs: plan
    if: needs.plan.outputs.iphone == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/gallery.yml
    with:
      language: en
      iphone_only: true

  linux:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: The library
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          tools/banner/media.sh "$PWD/.artifacts/media"
          # Every film, series and episode, for setup.mjs to wait for the whole scan.
          echo "MIRA_GALLERY_TITLES=$(( $(find .artifacts/media -name '*.mkv' | wc -l) + $(ls .artifacts/media/Séries | wc -l) ))" >> "$GITHUB_ENV"
          echo "MIRA_GALLERY_TRACES=$PWD/tools/banner/traces.json" >> "$GITHUB_ENV"
          du -sh .artifacts/media
      - name: Jellyfin 12.1 and its library
        run: |
          mkdir -p .artifacts/jf-config .artifacts/jf-cache
          docker run -d --name jellyfin --network host -v "$PWD/.artifacts/media:/media:ro" -v "$PWD/.artifacts/jf-config:/config" -v "$PWD/.artifacts/jf-cache:/cache" "$JELLYFIN_IMAGE"
          node tools/gallery/setup.mjs http://127.0.0.1:8096 /media "$GALLERY_USER" "$GALLERY_PASSWORD"
      - name: The films' backdrops
        run: node tools/banner/stills.mjs http://127.0.0.1:8096 "$GALLERY_USER" "$GALLERY_PASSWORD" .artifacts/captures/stills
      - name: Mira for Mac (Linux, virtual display, at ×2; no picture in the player)
        if: needs.plan.outputs.mac == 'true'
        run: |
          sudo apt-get install -y -q xvfb libgl1-mesa-dri >/dev/null
          dotnet build src/Mira.Mac/Mira.Mac.csproj -c Release -nologo -v q
          dll=$(find src/Mira.Mac/bin/Release -name Mira.dll | head -1)
          export MIRA_GALLERY_SERVER=http://127.0.0.1:8096 MIRA_GALLERY_USER="$GALLERY_USER" MIRA_GALLERY_PASSWORD="$GALLERY_PASSWORD" AVALONIA_GLOBAL_SCALE_FACTOR=2 LANG=en_US.UTF-8
          timeout 300 xvfb-run -a -s "-screen 0 3200x2000x24" dotnet "$dll" --data .artifacts/mac-profile --gallery .artifacts/captures/mac || true
          result=$(cat .artifacts/captures/mac/gallery-result.txt 2>/dev/null || echo 'FAIL: no result')
          echo "$result"
          [[ "$result" == PASS* ]] || { echo "::error::Mira for Mac's captures failed"; exit 1; }
      - name: Jellyfin log
        if: failure()
        run: docker logs jellyfin 2>&1 | tail -80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: banner-captures
          path: .artifacts/captures
          retention-days: 7

  draw:
    needs: [plan, windows, iphone, linux]
    # The Windows and iPhone jobs are skipped when no point shows on them.
    if: >-
      always() && needs.plan.result == 'success' && needs.linux.result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      && (needs.iphone.result == 'success' || needs.iphone.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: banner-captures
          path: .artifacts/captures
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.windows.result == 'success'
        with:
          name: gallery-windows
          path: .artifacts/captures/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.iphone.result == 'success'
        with:
          name: gallery-iphone
          path: .artifacts/captures/iphone
      - name: Draw the banner
        run: |
          find .artifacts/captures -type f | sort
          npm install --silent --no-audit --no-fund --prefix .artifacts/pw playwright@1.56.1
          npx --prefix .artifacts/pw playwright install --with-deps chromium >/dev/null
          mkdir -p docs/releases
          PLAYWRIGHT="$PWD/.artifacts/pw/node_modules/playwright/index.mjs" node tools/banner/banner.mjs "$VERSION" .artifacts/captures "docs/releases/$VERSION.jpg"
          ls -la docs/releases
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: banner
          path: docs/releases/${{ inputs.version }}.jpg
          retention-days: 7
      - name: Commit
        # Only on another branch than main: main takes it through a pull request.
        if: github.ref_name != 'main'
        env:
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          git add "docs/releases/$VERSION.jpg"
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Draw the banner of Mira $VERSION"
          git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:$BRANCH"
